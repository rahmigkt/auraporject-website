<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2eee5"><meta name="robots" content="noindex,nofollow"><title>NAKIŞ — Kumaşın Geometrisi</title><link rel="stylesheet" href="style.css?v=3"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 2 25 15 38 20 25 25 20 38 15 25 2 20 15 15Z' fill='%23692e37'/%3E%3C/svg%3E"></head><body>
<header><a class="brand" href="./" aria-label="Nakış ana sayfa"><span class="brandmark">✳</span> NAKIŞ<span class="brand-sub" data-tr="DİJİTAL DESEN ATÖLYESİ" data-en="A DIGITAL TEXTILE ATELIER"></span></a><nav><button id="language" class="text-button" aria-label="Change language">EN</button><button id="about" class="text-button" data-tr="Çalışma hakkında" data-en="About the study"></button><button id="exhibit" class="dark-button" data-tr="Sergiyi aç ↗" data-en="Enter exhibition ↗"></button></nav></header>
<main><section class="intro"><div class="eyebrow" data-tr="MOTİF, HAREKET VE HAFIZA / 01" data-en="MOTIF, MOVEMENT & MEMORY / 01"></div><div class="intro-row"><h1 data-tr="Kumaşın geometrisi." data-en="The geometry of cloth."></h1><p data-tr="Bir çizginin desene, bir desenin kumaşa dönüşümü. Geleneksel motiflerden ilham alan yaşayan bir matematik çalışması." data-en="From a single line to a patterned cloth. A living mathematical study inspired by textile traditions."></p></div></section>
<section class="circle-lab"><div><span class="eyebrow" data-tr="DAİRELERLE OLUŞUM" data-en="FORMATION THROUGH CIRCLES"></span><p id="circleStatus" aria-live="polite"></p></div><div id="circleCounts" aria-label="Daire sayısı"></div></section><section class="workbench"><div class="visual"><div class="canvas-wrap"><canvas id="cloth" aria-label="Motif oluşumu ve kumaş üzerinde tekrar eden desen"></canvas><button class="canvas-full" id="fullscreen" aria-label="Tam ekran">↗</button></div><div class="transport"><button id="play" class="round-button" aria-label="Oluşumu oynat">▶</button><div class="transport-caption"><b id="phaseLabel"></b><span id="timeLabel"></span></div><input id="scrub" type="range" min="0" max="1000" value="1000" aria-label="Oluşum zaman çizelgesi"><button id="restart" class="text-button" aria-label="Başa dön">↺</button><label class="loop"><input type="checkbox" id="loop"><span data-tr="Döngü" data-en="Loop"></span></label></div></div>
<aside class="story"><span class="eyebrow" data-tr="BİR MOTİFİN YOLCULUĞU" data-en="THE JOURNEY OF A MOTIF"></span><h2 id="storyTitle"></h2><p id="storyCopy"></p><div id="steps" class="steps"></div><div class="equation"><div class="equation-head"><span id="equationLabel"></span><span class="small-dot"></span></div><pre id="equation"></pre><p id="equationNote"></p></div><div class="story-bottom"><span data-tr="ÇİZGİ → MOTİF → TEKRAR → KUMAŞ" data-en="LINE → MOTIF → REPEAT → CLOTH"></span><button id="formulaButton" class="text-button" data-tr="Formülü incele ↗" data-en="Explore the equation ↗"></button></div></aside></section>
<section class="atelier"><div class="section-title"><h2 data-tr="Deseninizi oluşturun" data-en="Compose your textile"></h2><p data-tr="Her değişiklik, çizimi ve formülü birlikte yeniden kurar." data-en="Every adjustment redraws the pattern and its equation."></p></div><div class="controls"><div class="motif-control"><div class="label-row"><label data-tr="01 / MOTİF" data-en="01 / MOTIF"></label><button class="text-button" id="import" data-tr="Kendi SVG’nizi alın +" data-en="Import your SVG +"></button></div><div id="motifs" class="motifs"></div><p class="caption" data-tr="Çağdaş geometrik yorumlar; tarihî eserlerin birebir kopyaları değildir." data-en="Contemporary geometric interpretations, not facsimiles of historical objects."></p></div><div><label class="control-label" data-tr="02 / TEKRAR DÜZENİ" data-en="02 / REPEAT STRUCTURE"></label><select id="repeat" aria-label="Tekrar düzeni"><option value="straight" data-tr="Düz tekrar" data-en="Straight repeat"></option><option value="halfdrop" data-tr="Yarım kaydırmalı" data-en="Half-drop repeat"></option><option value="mirror" data-tr="Aynalı tekrar" data-en="Mirrored repeat"></option></select><label class="slider-label" for="scale"><span data-tr="Motif ölçeği" data-en="Motif scale"></span><output id="scaleValue"></output></label><input id="scale" type="range" min="50" max="115" value="92"><label class="slider-label" for="petals"><span data-tr="Dilim / köşe sayısı" data-en="Petals / points"></span><output id="petalsValue"></output></label><input id="petals" type="range" min="4" max="12" step="1" value="8"></div><div><label class="control-label" data-tr="03 / RENK VE YÜZEY" data-en="03 / COLOUR & SURFACE"></label><div id="palettes" class="palettes"></div><div class="segmented"><button id="print" data-tr="Baskı" data-en="Print"></button><button id="stitch" data-tr="İşleme izi" data-en="Stitch study"></button></div><p class="caption" data-tr="İşleme izi görsel bir çalışmadır; makine nakış dosyası değildir." data-en="The stitch view is a visual study, not a machine embroidery file."></p></div><div><label class="control-label" data-tr="04 / ÖLÇÜ VE ÇIKTI" data-en="04 / SIZE & OUTPUT"></label><div class="size-row"><label for="mm" data-tr="Hücre eni" data-en="Cell width"></label><input id="mm" type="number" min="20" max="500" step="5" value="100"><span>mm</span></div><p id="tileSize" class="caption"></p><button id="svgTile" class="dark-button wide" data-tr="Tekrar birimi · SVG ↓" data-en="Repeat tile · SVG ↓"></button><div class="download-row"><button id="svgMotif" class="text-button" data-tr="Motif SVG ↓" data-en="Motif SVG ↓"></button><button id="png" class="text-button" data-tr="Görsel PNG ↓" data-en="Image PNG ↓"></button></div></div></div></section>
<section class="exhibition-note"><div><span class="eyebrow" data-tr="SERGİ İÇİN HAZIRLANAN ÇALIŞMA" data-en="AN EXHIBITION STUDY"></span><h2 data-tr="Gelenekten gelen ritim.\nMatematikle görünen düzen." data-en="A rhythm inherited.\nA structure revealed."></h2></div><div><p data-tr="Tekrar eden bir desenin ardında öteleme, yansıma ve ölçü vardır. Bu atölye, o ilişkileri çizim sırasında görünür kılar. Her motif, aynı kurallarla yeniden üretilebilen bir SVG desenine dönüşür." data-en="Translation, reflection and proportion lie behind a repeating pattern. This atelier makes those relationships visible as it draws. Each motif becomes an SVG textile that can be reproduced from the same rules."></p><button id="record" class="outline-button" data-tr="74 saniyelik oluşumu kaydet ↗" data-en="Record the 74-second formation ↗"></button><button id="stopRecord" hidden data-tr="Kaydı bitir" data-en="Stop recording"></button><p class="caption" id="recordHint" data-tr="Çizim, tekrar ve final formülü kayda dahildir. Kayıt sırasında sekmeyi açık tutun." data-en="Drawing, repetition and the final equation are included. Keep this tab open during recording."></p></div></section>
<footer><span>NAKIŞ / <span data-tr="DİJİTAL TEKSTİL ÇALIŞMASI" data-en="DIGITAL TEXTILE STUDY"></span></span><span data-tr="Bir motif. Sonsuz olasılık." data-en="One motif. Endless possibilities."></span><a href="../" data-tr="Mizan atölyesi ↗" data-en="Mizan atelier ↗"></a></footer></main>
