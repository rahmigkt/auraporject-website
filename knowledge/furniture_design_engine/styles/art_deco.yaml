# PARÇA DİREKTİFLERİ — her parça bu stilde nasıl davranır?
# part_role değerleri schemas/furniture_parts.schema.json -> $defs.partRoleId
part_directives:
  - part_role: leg
    directive: Tapered columnar leg (fluted or plain), 40-60 mm at top to 25-35 mm at floor; or a recessed plinth. Chrome/brass sabots 10-20 mm at the foot.
    directive_tr: Konik kolon bacak (oluklu veya düz), üstte 40-60 mm, zeminde 25-35 mm; ya da içerlek kaide. Ayakta 10-20 mm krom/pirinç pabuç.
    typical_material: macassar_ebony_veneer
    typical_dimension_hint: height 100-180mm (casegoods), 400-450mm (chairs)
    ornament_level: moderate
    priority: must
  - part_role: foot
    directive: Polished metal sabot or a 3-5 mm chrome band wrapping the base; never a raw timber end grain on the floor.
    directive_tr: Parlak metal pabuç veya kaideyi saran 3-5 mm krom bant; zeminde asla ham ahşap uç damarı.
    typical_material: chrome_polished
    typical_dimension_hint: sabot height 10-20mm
    ornament_level: moderate
    priority: should
  - part_role: base_plinth
    directive: Recessed 30-50 mm from the body face, 40-90 mm high, black lacquer or veneer; creates the floating luxury read.
    directive_tr: Gövdeden 30-50 mm içerlek, 40-90 mm yüksek, siyah lake veya kaplama; yüzme hissini veren lüks okumayı yaratır.
    typical_material: lacquer_black_gloss
    typical_dimension_hint: recess 30-50mm; height 40-90mm
    ornament_level: subtle
    priority: must
  - part_role: panel
    directive: Book-matched veneer with a mirrored grain axis, 15-40 mm inset border, or a black lacquer field carrying one inlay geometry.
    directive_tr: Aynalı damar eksenli eşleştirilmiş kaplama, 15-40 mm içerlek bordür, veya tek bir kakma geometrisi taşıyan siyah lake alan.
    typical_material: macassar_ebony_veneer
    typical_dimension_hint: veneer 0.6mm on 19mm substrate; inset 20-40mm
    ornament_level: rich
    priority: must
  - part_role: door
    directive: Full-height mirrored pair, chevron or sunburst parquetry, 3.4 mm gap pre-lacquer, recessed chrome pull or a single brass bar.
    directive_tr: Tam boy aynalı çift kanat, şevron veya güneş ışını parkesi, lake öncesi 3.4 mm aralık, içerlek krom çekme veya tek pirinç çubuk.
    typical_material: walnut_burl_veneer
    typical_dimension_hint: height/width >= 1.8; pair symmetric about the centre axis
    ornament_level: rich
    priority: should
  - part_role: top_surface
    directive: 20 mm veined marble with a polished or eased edge, or a waterfall-wrapped veneer/lacquer top with R15-R40 continuing down the sides.
    directive_tr: Parlak veya yumuşatılmış kenarlı 20 mm damarlı mermer, ya da kenarlardan aşağı devam eden R15-R40 ile şelale sarmalı kaplama/lake tabla.
    typical_material: marble_honed_or_polished
    typical_dimension_hint: marble 20mm; waterfall radius 15-40mm; overhang 20-40mm
    ornament_level: moderate
    priority: must
  - part_role: shelf
    directive: 10 mm smoked glass on concealed chrome pins, or 19 mm veneered shelf with a 2 mm chrome reveal under the front edge.
    directive_tr: Gizli krom pimlerde 10 mm füme cam, ya da ön kenarın altında 2 mm krom çizgili 19 mm kaplamalı raf.
    typical_material: glass_smoked
    typical_dimension_hint: glass 10mm, span <= 800mm; wood 19mm, span <= 700mm
    ornament_level: subtle
    priority: should
  - part_role: hardware
    directive: 'Polished chrome or brass only: a stepped bar pull, a cylindrical knob, or a recessed finger pull with a chrome reveal. Symmetrically placed.'
    directive_tr: 'Yalnızca parlak krom veya pirinç: basamaklı çubuk kulp, silindirik topuz veya krom çizgili içerlek parmak çekme. Simetrik yerleşim.'
    typical_material: chrome_polished
    typical_dimension_hint: pull 128-256mm; diameter 12-16mm
    ornament_level: rich
    priority: must
  - part_role: ornament
    directive: 'One focal geometric motif on the central axis in the upper third: sunburst fan, chevron band, or stepped ziggurat relief. Mirrored, exact pitch, non-figurative.'
    directive_tr: 'Üst üçte birde merkez eksende bir odak geometrik motif: güneş ışını yelpazesi, şevron bant veya basamaklı ziggurat relifi. Aynalı, tam adım, figüratif değil.'
    typical_material: brass_polished
    typical_dimension_hint: inlay line 2-5mm; step increment 15-40mm; flute pitch 8-20mm
    ornament_level: rich
    priority: must
  - part_role: edge_treatment
    directive: Radius 6-25 mm on horizontal arrises, or a 2-5 mm metal band wrapping the edge. Never a raw square edge on a show face.
    directive_tr: Yatay kenarlarda 6-25 mm yarıçap veya kenarı saran 2-5 mm metal bant. Görünür yüzde asla ham keskin kenar.
    typical_material: chrome_polished
    typical_dimension_hint: R6-25mm; banding 2-5mm
    ornament_level: moderate
    priority: must
  - part_role: upholstery
    directive: Taut black aniline leather or one deep jewel-tone velvet; fluted or channel-stitched in a constant pitch is allowed, tufting is not.
    directive_tr: Gergin siyah anilin deri veya tek koyu mücevher tonu kadife; sabit adımda oluklu veya kanal dikişli kabul edilir, kapitone yok.
    typical_material: leather_aniline_black
    typical_dimension_hint: pad 60-110mm; channel pitch 60-120mm
    ornament_level: moderate
    priority: should
  - part_role: seat
    directive: Firm, 60-100 mm, taut upholstery over webbing + foam; seat height 430-460 mm; no loose cushion look.
    directive_tr: Sert, 60-100 mm, dokuma + sünger üstünde gergin döşeme; oturma yüksekliği 430-460 mm; gevşek minder görünümü yok.
    typical_material: leather_aniline_black
    typical_dimension_hint: seat height 430-460mm; depth 430-480mm
    ornament_level: subtle
    priority: must
  - part_role: back_support
    directive: Fan-shaped or stepped crest, upholstered or veneered, symmetric about the centre; height 380-520 mm above seat.
    directive_tr: Yelpaze şeklinde veya basamaklı tepe, döşemeli veya kaplamalı, merkez etrafında simetrik; oturmada 380-520 mm yükseklik.
    typical_material: macassar_ebony_veneer
    typical_dimension_hint: back height 380-520mm above seat
    ornament_level: rich
    priority: must
  - part_role: frame
    directive: 'Hidden behind veneer/lacquer: 19 mm MDF or birch ply carcass, sealed on all six faces, mitred and splined corners.'
    directive_tr: 'Kaplama/lake arkasında gizli: 19 mm MDF veya huş kontrplak gövde, altı yüzü de mühürlü, gönyeli ve lamelli köşeler.'
    typical_material: lacquer_black_gloss
    typical_dimension_hint: 19mm carcass; 0.6mm veneer; 0.4mm lacquer build
    ornament_level: none
    priority: must
# -----------------------------------------------------------------------------
# CANLI ÇİZİM GERİ BİLDİRİM CÜMLELERİ
sketch_feedback:
  on_good_signal:
    - Symmetry axis detected and both halves match. That is the foundation of the style.
    - Step increments are equal — the ziggurat reads correctly.
    - Flute pitch is constant across the run. Machine precision achieved by hand.
    - One focal motif on the centre axis. Correct restraint within an ornamental style.
  on_weak_signal:
    - Contrast is low. Add a specular element (chrome banding, marble, lacquer) — Deco needs gloss.
    - Void ratio is high; Deco prefers mass. Close some openings or thicken the frame.
    - The silhouette is squat. Elongate vertically to reach h/w >= 1.4 for casegoods.
  on_violation:
    - Asymmetry detected. Art Deco requires strict bilateral symmetry about the central axis.
    - Organic/freehand curve detected. Curves must be constant-radius arcs, waterfall wraps or concentric circles.
    - Figurative ornament detected. Motifs must be geometric and non-figurative.
    - All-matte surface detected. This style requires at least one high-gloss or polished metal field.
    - More than one motif family detected. Pick sunburst OR chevron OR fluting — one focal system.
    - Inlay covering more than 20% of a face. Pull it back to line-work.
    - Prohibited material detected (ivory/tortoiseshell/CITES timber). Substitute a declared legal alternative.
    - 'Load path failed: a heavy stone top is spanning without a supporting frame.'
  on_violation_tr:
    - Asimetri tespit edildi. Art Deco merkez eksen etrafında katı iki taraflı simetri gerektirir.
    - Organik/serbest eğri tespit edildi. Eğriler sabit yarıçaplı yay, şelale sarmalı veya eş merkezli daire olmalı.
    - Figüratif süsleme tespit edildi. Motifler geometrik ve figüratif olmayan olmalı.
    - Tamamen mat yüzey tespit edildi. Bu stil en az bir yüksek parlak veya cilalı metal alan gerektirir.
    - Birden fazla motif ailesi tespit edildi. Güneş ışını VEYA şevron VEYA oluk seçin — tek odak sistem.
    - Kakma bir yüzün %20'sini aşıyor. Çizgi işine geri çek.
    - Yasaklı malzeme tespit edildi (fildişi/bağa/CITES ahşabı). Beyan edilen yasal bir alternatif kullan.
    - 'Yük yolu başarısız: ağır bir taş tabla destek çerçevesi olmadan açıklık geçiyor.'
  suggested_next_strokes:
    - Draw the central vertical axis first, then mirror every element across it.
    - Add 3-5 equal steps to the top profile (ziggurat), increment 15-40 mm.
    - Insert a sunburst fan centred on the axis in the upper third.
    - Draw a constant-pitch fluted column at each side.
    - Recess the plinth 30-50 mm to make the body float.
    - Add a 2-5 mm chrome band along the top arris.
