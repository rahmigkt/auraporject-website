# STİL UYUMLULUĞU VE HİBRİT TARİFLERİ
compatibility:
  blends_well_with:
    - hollywood_regency
    - streamliner
    - neo_classical_restrained
    - high_gloss_contemporary
  conflicts_with:
    - japandi
    - wabi_sabi
    - brutalism
    - bauhaus
    - memphis
    - gothic_minimalism
    - scandinavian_modern
    - industrial
  hybrid_recipes:
    - result_style_id: deco_streamline
      mix:
        - { style_id: art_deco, ratio: 0.6 }
        - { style_id: high_tech, ratio: 0.4 }
      note: Drop the sunburst, keep waterfall radius and chrome banding; increase horizontal speed lines; reduce ornament_density to 0.4.
    - result_style_id: deco_noir
      mix:
        - { style_id: art_deco, ratio: 0.55 }
        - { style_id: gothic_minimalism, ratio: 0.45 }
      note: Keep strict symmetry and stepped massing; remove all inlay and metal shine except one aged brass line; drop gloss_absence gate to <= 0.5; raise dark_materiality to 0.9.
# -----------------------------------------------------------------------------
# YASAL / ETİK UYUM
compliance:
  cultural_sensitivity_notes: 'Art Deco borrowed heavily from Egyptian, Mesopotamian, African and Mesoamerican sources. Use GEOMETRY (steps, rays, chevrons) rather than sacred or funerary imagery (deities, hieroglyphs, masks, totems). Never render religious or funerary symbols as decoration. '
  religious_symbol_policy: forbidden_as_content / permitted_as_abstract_geometry
  do_not_replicate:
    - ivory, tortoiseshell, or any CITES-listed material (hard legal ban)
    - named 1920-40 designer pieces (recognisable authorial silhouettes)
    - specific historic building interiors (e.g. a named cinema foyer) as a 1:1 transfer
    - sacred or funerary iconography from source cultures
