    - spikes for decoration
  anatomy_defects:
    - mismatched legs
    - legs of different lengths
    - floating furniture with no ground contact
    - impossible joint
    - parts merging into each other
    - duplicated components
    - chair with three legs
    - backrest not connected to seat frame
    - warped frame
    - asymmetric where symmetry intended
    - table top unsupported overhang beyond 150mm
    - seat too thin to bear load
    - melting geometry
    - blurry joinery
  physics_defects:
    - paper-thin stone slab
    - concrete cantilever without reinforcement depth
    - wood grain running across the load path
    - top-heavy without base mass
    - no visible load path to the floor
    - impossibly slender 4mm wooden leg
    - floating mass with no support
  copyright_guards:
    - exact replica of a known designer chair
    - branded furniture
    - visible logo
    - trademarked product
    - copy of a specific historic monument
    - photograph of an existing product
# -----------------------------------------------------------------------------
# ÜRETİM NOTLARI
manufacturing_notes:
  preferred_processes:
    - cnc_milling
    - cnc_routing
    - lathe_turning
    - mortise_tenon
    - welding_tig
    - concrete_casting
    - surface_grinding
    - oil_finishing
    - shou_sugi_ban
  avoid_processes:
    - injection_molding
    - hand_carving (except a single accent facet)
    - veneer_pressing on visible faces
  joint_language:
    - through-tenon with a 3 mm proud end, chamfered
    - hidden steel bracket for plinth-to-body
    - twin dowel + adhesive for blade rhythm frames
    - welded black-oxide steel node, ground flush
    - shadow-gap floating shelf on concealed steel pin
  joinery_visibility: celebrated
  typical_thickness_mm:
    oak_frame_member: 32
    oak_panel: 22
    steel_member: 10
    concrete_plinth: 60
    stone_top: 30
    felt_pad: 12
    glass_panel: 8
    brass_inlay: 3
  tolerance_notes: 'Chamfer arris must stay crisp: +/-0.3 mm on visible edges. Shadow gaps need a constant 8 mm +/-0.5 mm, otherwise the reveal reads as a defect. Wood movement: leave 2 mm per 500 mm of cross-grain width; use slotted screw holes on all top-to-frame fixings. '
  finishing_notes: 'Blackening via iron-acetate ebonising on oak (tannin reaction) or commercial black oxide on steel. Finish with hardwax oil at 5-10 gloss units max. Never use polyurethane gloss. Concrete: seal with matte penetrating silane, do not film-form. '
  cost_drivers:
    - stone/concrete tops (weight + freight)
    - chamfer consistency over long edges (machine time)
    - aged brass hardware in small batches
    - black oxide steel finishing
  sustainability_notes: FSC oak, low-carbon cement blends (GGBS/fly ash) where structural calc allows, no PVC, no solvent-based gloss lacquer.
  flat_pack_feasible: true
  difficulty: 3
