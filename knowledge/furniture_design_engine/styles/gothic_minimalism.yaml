# PARÇA DİREKTİFLERİ — her parça bu stilde nasıl davranır?
# part_role değerleri schemas/furniture_parts.schema.json -> $defs.partRoleId
part_directives:
  - part_role: leg
    directive: Vertical, chamfered, tapering inward 0-3°; section 32-45 mm oak or 10-16 mm black-oxide steel; no turned profile, no foot ornament except an optional brass cap.
    directive_tr: Dikey, pahlı, 0-3° içe konikleşen; kesit 32-45 mm meşe veya 10-16 mm karartılmış çelik; torna profil yok, opsiyonel pirinç pabuç dışında ayak süsü yok.
    typical_material: blackened_oak
    typical_dimension_hint: height 400-720mm; slenderness ratio <= 18 (wood), <= 26 (steel)
    ornament_level: none
    priority: must
  - part_role: foot
    directive: Either flush (monolith lands directly) or a 12-20 mm recessed plinth. A single aged brass cap is the only permitted accent.
    directive_tr: Ya sıfır (monolit doğrudan basar) ya 12-20 mm içerlek kaide. Tek eskitilmiş pirinç pabuç izin verilen tek vurgu.
    typical_material: steel_blackened
    typical_dimension_hint: recess 12-20mm; cap height <= 15mm
    ornament_level: subtle
    priority: should
  - part_role: back_support
    directive: Tall, narrow, lancet-proportioned. Top edge may terminate in a single ogive apex (rise 30-80 mm). Boards 18-24 mm with 6-10 mm shadow gaps, or 3-5 vertical blades.
    directive_tr: Yüksek, dar, lancet oranlı. Üst kenar tek bir ogive tepe noktasıyla bitebilir (yükselme 30-80 mm). 18-24 mm tahtalar 6-10 mm gölge aralıklı ya da 3-5 dikey bıçak.
    typical_material: blackened_oak
    typical_dimension_hint: backrest height 480-720mm above seat; width 0.8-0.95 x seat width
    ornament_level: subtle
    priority: must
  - part_role: seating_surface
    directive: Flat, matte, 20-45 mm solid; a 4-8 mm felt or leather pad is allowed but must not read as plush. No tufting, no piping, no quilting.
    directive_tr: Düz, mat, 20-45 mm masif; 4-8 mm keçe veya deri ped kabul edilir ama tombul görünmemeli. Kapitone, biye, dikiş deseni yok.
    typical_material: blackened_oak
    typical_dimension_hint: seat height 420-450mm (chair), depth 400-450mm
    ornament_level: none
    priority: must
  - part_role: arm_support
    directive: 'Optional. If present: a single straight or very slightly keeled horizontal member at 200-230 mm above seat, chamfered underside. Never padded, never curved outward.'
    directive_tr: 'Opsiyonel. Varsa: oturma yüzeyinden 200-230 mm yukarıda tek düz veya çok hafif omurgalı yatay eleman, alt yüzü pahlı. Asla pedli, asla dışa kavisli.'
    typical_material: blackened_oak
    typical_dimension_hint: arm height above seat 200-230mm; section 25x40mm
    ornament_level: none
    priority: may
  - part_role: frame
    directive: 'Orthogonal, expressed. Show the joint: through-tenon proud 3 mm or ground-flush welded steel node. Frame members constant section throughout the piece.'
    directive_tr: 'Ortogonal, ifade edilmiş. Birleşimi göster: 3 mm taşan geçer zıvana veya taşlanmış kaynaklı çelik düğüm. Çerçeve elemanları parça boyunca sabit kesit.'
    typical_material: steel_blackened
    typical_dimension_hint: constant section 10-16mm steel / 30-40mm oak
    ornament_level: none
    priority: must
  - part_role: stretcher
    directive: Allowed only where the load path needs it. Prefer a single low H-stretcher or none at all; steel tension rod 8-12 mm is an acceptable modern reading.
    directive_tr: Yalnızca yük yolu gerektiriyorsa. Tek alçak H-kiriş ya da hiç; 8-12 mm çelik gergi çubuğu modern bir okuma olarak kabul edilir.
    typical_material: steel_blackened
    typical_dimension_hint: 8-16mm section, 80-140mm above floor
    ornament_level: none
    priority: may
  - part_role: panel
    directive: Flat, unframed where possible, or framed with a 8 mm shadow gap. Boarded panels with vertical grain; never a raised field, never a moulded edge.
    directive_tr: Mümkünse çerçevesiz düz panel veya 8 mm gölge aralıklı çerçeveli. Dikey damarlı tahta panel; asla yükseltilmiş alan, asla profilli kenar.
    typical_material: blackened_oak
    typical_dimension_hint: 18-22mm thick; board width 90-160mm
    ornament_level: none
    priority: must
  - part_role: door
    directive: 'Full-height lancet proportion, single leaf preferred. Handle: a 6-10 mm recessed edge pull or one aged brass bar, never a decorative knob.'
    directive_tr: 'Tam boy lancet oran, tek kanat tercih. Kulp: 6-10 mm içerlek kenar çekme veya tek eskitilmiş pirinç çubuk; asla dekoratif topuz.'
    typical_material: blackened_oak
    typical_dimension_hint: height/width >= 2.2; gap 3mm all round
    ornament_level: subtle
    priority: should
  - part_role: shelf
    directive: Constant pitch (32 mm module), 20-28 mm thick, span <= 700 mm in oak without support. Floating shelves on concealed steel pins with a 10 mm shadow gap underneath.
    directive_tr: Sabit adım (32 mm modül), 20-28 mm kalınlık, desteksiz meşede açıklık <= 700 mm. Gizli çelik pimlerde yüzer raf, altta 10 mm gölge aralığı.
    typical_material: blackened_oak
    typical_dimension_hint: pitch 250-350mm; thickness 20-28mm
    ornament_level: none
    priority: must
  - part_role: hardware
    directive: Aged brass or black oxide only. Max one visible hardware family per piece. Recessed, minimal, never a focal ornament.
    directive_tr: Yalnızca eskitilmiş pirinç veya siyah oksit. Parça başına en fazla bir görünür donanım ailesi. İçerlek, minimal, asla odak süsü.
    typical_material: brass_aged
    typical_dimension_hint: bar 96-160mm; recess 6-10mm
    ornament_level: subtle
    priority: must
  - part_role: joint
    directive: 'Celebrated but disciplined: one joint type per piece, repeated with the same rhythm. Chamfer every arris of the joint at 45°.'
    directive_tr: 'Kutlanan ama disiplinli: parça başına tek birleşim tipi, aynı ritimle tekrarlanan. Birleşimin her kenarını 45° pahla.'
    typical_material: blackened_oak
    typical_dimension_hint: tenon thickness = 1/3 member thickness
    ornament_level: subtle
    priority: should
  - part_role: top_surface
    directive: Knife edge (3-6 mm arris chamfer) on stone/concrete; 45° chamfer on timber. Overhang max 40 mm beyond the frame unless structurally supported.
    directive_tr: Taş/betonda bıçak kenar (3-6 mm pah); ahşapta 45° pah. Yapısal destek yoksa çerçeveden en fazla 40 mm taşma.
    typical_material: limestone_honed
    typical_dimension_hint: stone 30mm, concrete 40-60mm, timber 25-35mm
    ornament_level: none
    priority: must
  - part_role: base_plinth
    directive: Recessed 20-40 mm from the body face to create a shadow line and a floating read. 40-90 mm high.
    directive_tr: Gölge çizgisi ve yüzme hissi için gövdeden 20-40 mm içerlek. 40-90 mm yükseklik.
    typical_material: concrete_cast
    typical_dimension_hint: height 40-90mm; recess 20-40mm
    ornament_level: none
    priority: should
  - part_role: void
    directive: 'Treat void as a designed part: ogival or lancet-shaped openings, 25-45% of the frontal envelope, edges chamfered to sharpen the shadow.'
    directive_tr: 'Boşluğu tasarlanmış bir parça say: ogival veya lancet açıklıklar, ön zarfın %25-45''i, gölgeyi keskinleştirmek için kenarları pahlı.'
    typical_material: null
    typical_dimension_hint: opening h/w ratio 2.5-4.0
    ornament_level: none
    priority: must
  - part_role: ornament
    directive: 'Only one of: single metal inlay line, chamfer shadow groove, blade rhythm, ogival void. Never figurative, never repeated across components.'
    directive_tr: 'Yalnızca şunlardan biri: tek metal kakma çizgisi, pah gölge oluğu, bıçak ritmi, ogival boşluk. Asla figüratif, asla birden fazla parçada tekrarlı.'
    typical_material: brass_aged
    typical_dimension_hint: inlay 2-6mm wide; flute depth <= 4mm
    ornament_level: subtle
    priority: may
  - part_role: upholstery
    directive: Taut, matte, thin (8-25 mm). Dark wool felt, heavy linen or vegetable-tanned black leather. Tight-fit, no visible stitching pattern beyond a single perimeter seam.
    directive_tr: Gergin, mat, ince (8-25 mm). Koyu yün keçe, ağır keten veya bitkisel tabaklanmış siyah deri. Sıkı oturuş, tek çevre dikişi dışında görünür dikiş deseni yok.
    typical_material: wool_felt_dark
    typical_dimension_hint: pad 8-25mm; seam allowance 10mm
    ornament_level: none
    priority: should
  - part_role: edge_treatment
    directive: 45° chamfer 3-8 mm on every visible arris. This is the style's signature line — it must be consistent within 0.3 mm.
    directive_tr: Her görünür kenarda 45° pah, 3-8 mm. Bu stilin imza çizgisidir — 0.3 mm içinde tutarlı olmalı.
    typical_material: null
    typical_dimension_hint: chamfer 3-8mm @45°
    ornament_level: subtle
    priority: must
  - part_role: light_channel
    directive: If integrated lighting exists, it must be a hidden linear recess (2700K, <150 lm/m) grazing a vertical surface. No visible fixture, no colour light.
    directive_tr: Entegre aydınlatma varsa gizli lineer bir oyuk olmalı (2700K, <150 lm/m), dikey yüzeyi sıyırır. Görünür armatür yok, renkli ışık yok.
    typical_material: steel_blackened
    typical_dimension_hint: recess 10x10mm; 2700K
    ornament_level: none
    priority: may
# -----------------------------------------------------------------------------
# CANLI ÇİZİM GERİ BİLDİRİM CÜMLELERİ
sketch_feedback:
  on_good_signal:
    - Strong vertical rhythm detected — this reads as ascension. Keep the pitch constant.
    - 'That apex is a clean ogive. Good: the arch is structural, not applied.'
    - Chamfer line consistent. This is the signature shadow edge of the style.
    - Void proportion is in the 25-45% band. The negative space is doing the decorating.
  on_weak_signal:
    - Verticality is weak — height/width is under 1.4. Consider raising the back or narrowing the body.
    - The arch reads as semicircular (Romanesque). Raise the apex or split the centre to make it an ogive.
    - No chamfer detected on visible edges. Without it the shadow line disappears and the style goes flat.
  on_violation:
    - Too many ornamental gestures. Gothic Minimalism allows ONE. Pick the arch, the inlay, or the blade rhythm — not all three.
    - Curvature is becoming organic/freehand. Snap to the orthogonal frame; curves are only permitted as ogive geometry.
    - Glossy/high-reflectance surface detected. This style is matte only (gloss < 10 units).
    - Saturated colour detected. Palette must stay in 8-45 L* with a single brass accent.
    - Part count is above 8 primary members. Reduce, or merge into a monolithic volume.
    - 'Figurative/religious motif detected. This style is secular-austere: no iconography.'
    - 'Structural check failed: the load path from seat to floor is not continuous.'
  on_violation_tr:
    - Çok fazla süsleme jesti var. Gotik Minimalizm BİR tane kabul eder. Kemer, kakma veya bıçak ritmi — üçü birden olmaz.
    - Eğrilik organik/serbest hale geliyor. Ortogonal çerçeveye oturt; eğri yalnızca ogive geometrisi olarak kabul edilir.
    - Parlak/yüksek yansımalı yüzey tespit edildi. Bu stil yalnızca mattır (gloss < 10 birim).
    - Doygun renk tespit edildi. Palet 8-45 L* aralığında kalmalı, tek vurgu pirinç.
    - Ana eleman sayısı 8'in üzerinde. Azalt ya da monolitik bir kütleye birleştir.
    - 'Figüratif/dini motif tespit edildi. Bu stil dünyevi-çilecidir: ikonografi yok.'
    - 'Yapısal kontrol başarısız: oturma yüzeyinden zemine yük yolu kesintisiz değil.'
  suggested_next_strokes:
    - Draw the ground line first, then the two outer verticals at the target width.
    - 'Add the apex: raise a single point 30-80 mm above the top rail centre.'
    - Insert 3 vertical blades at constant pitch to create the blade rhythm.
    - 'Chamfer: draw a 3-8 mm 45° line on every visible arris.'
    - Cut one ogival void in the upper third — that is your single ornament.
# -----------------------------------------------------------------------------
# STİL UYUMLULUĞU VE HİBRİT TARİFLERİ
compatibility:
  blends_well_with: [brutalism, japandi, wabi_sabi, high_tech]
  conflicts_with:
    - memphis
    - art_deco
    - rococo_revival
    - tropical_resort
    - scandinavian_pastel
  hybrid_recipes:
    - result_style_id: gothic_brutalist
      mix:
        - { style_id: gothic_minimalism, ratio: 0.55 }
        - { style_id: brutalism, ratio: 0.45 }
      note: Concrete mass + ogival void + board-form texture. Increase massiveness to 0.8, keep ornament_density <= 0.1.
    - result_style_id: gothic_japandi
      mix:
        - { style_id: gothic_minimalism, ratio: 0.6 }
        - { style_id: japandi, ratio: 0.4 }
      note: Lighten the palette to 15-55 L*, swap concrete for smoked oak, keep the lancet void and chamfer discipline.
    - result_style_id: dark_academia_gothic
      mix:
        - { style_id: gothic_minimalism, ratio: 0.7 }
        - { style_id: dark_academia, ratio: 0.3 }
      note: Allow oiled walnut instead of blackened oak, add one leather field, permit ornament_density up to 0.2 (books-driven).
# -----------------------------------------------------------------------------
# YASAL / ETİK UYUM
compliance:
  cultural_sensitivity_notes: 'Gothic vocabulary originates in Christian ecclesiastical architecture. Use the GEOMETRY and the LIGHT LOGIC, not the religious content. Never generate crosses, saints, liturgical objects, or stained-glass iconography. Present the style as "secular vertical austerity", not as religious furniture. '
  religious_symbol_policy: forbidden_as_content / permitted_as_abstract_geometry
  do_not_replicate:
    - any specific cathedral's façade, window tracery or monument as a 1:1 transfer onto furniture
    - any named living designer's recognisable silhouette
    - any museum object marked 'no derivatives'
