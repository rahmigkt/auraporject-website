# TARİHSEL REFERANSLAR (yalnızca ilke/oran çıkarımı; birebir kopya YOK)
historical_references:
  - kind: movement
    title: French Rayonnant / Flamboyant Gothic structural logic (13th-15th c.)
    title_tr: Fransız Rayonnant / Flamboyant Gotik yapısal mantığı (13.-15. yy)
    date: 1240-1500
    region: Île-de-France
    why_relevant: Source of the ogive, lancet, and the idea that structure itself is the decoration.
    what_to_extract:
      - pointed arch geometry and two-centre construction
      - lancet proportions
      - reduction of wall to frame + void
      - vertical bay rhythm
    source_api: wikidata_sparql
    license: public_domain
    query_hint: SELECT ?item ?itemLabel WHERE { ?item wdt:P126 wd:Q176483 }
  - kind: technique
    title: Shou sugi ban / yakisugi (charred timber cladding)
    title_tr: Shou sugi ban / yakisugi (yakılmış ahşap)
    date: 18. yy - günümüz
    region: Japonya
    why_relevant: 'Provides the blackened timber surface: matte, textured, weather-resistant, honest.'
    what_to_extract:
      - surface charring depth 1-3 mm
      - brushed-off char
      - oil finish over char
    source_api: manual
    license: not_applicable
  - kind: technique
    title: Board-formed (béton brut) concrete
    title_tr: Kalıp izli beton (béton brut)
    date: 1920-1960
    region: Fransa / İsviçre
    why_relevant: Material honesty + shadow texture without ornament; the brutalist bridge into this style.
    what_to_extract:
      - board imprint pitch
      - tie-hole pattern discipline
      - honed arris on formwork edges
    source_api: manual
    license: not_applicable
  - kind: movement
    title: Minimalism (Donald Judd, Agnes Martin, John Pawson)
    title_tr: Minimalizm (Donald Judd, Agnes Martin, John Pawson)
    date: 1960-günümüz
    region: ABD / İngiltere
    why_relevant: Supplies the reduction discipline, the specific-object logic, and the void-as-content rule.
    what_to_extract:
      - unitary form, minimal part count
      - industrial fabrication honesty
      - repetition with a fixed interval
      - emptiness as the primary content
    source_api: met_openaccess
    license: unknown
    query_hint: 'Met Open Access search: q=minimalism&departmentId=21 (Modern and Contemporary Art) — metadata only, do not replicate artworks.'
  - kind: period
    title: Gothic Revival furniture (Pugin, Viollet-le-Duc)
    title_tr: Gotik canlanma mobilyası (Pugin, Viollet-le-Duc)
    date: 1830-1900
    region: İngiltere / Fransa
    why_relevant: Shows how gothic vocabulary was previously translated into furniture — useful as a CAUTIONARY reference.
    what_to_extract:
      - 'what to strip away: applied tracery, heavy carving, literal pinnacles'
      - 'what to keep: chamfer, pointed arch head rails, boarded construction'
    source_api: europeana
    license: public_domain
    query_hint: 'Europeana search: ''gothic revival furniture'' + rights=http://creativecommons.org/publicdomain/mark/1.0/'
  - kind: concept
    title: Cistercian austerity (unornamented stone abbey interiors)
    title_tr: Sisteriyen çileciliği (süsmesiz taş manastır iç mekânları)
    date: 12. yy
    region: Burgundy
    why_relevant: The historical proof that gothic verticality and ornament-free severity are compatible.
    what_to_extract:
      - plain ashlar wall
      - single light source
      - no figurative imagery
      - proportional bay rhythm
    source_api: wikidata_sparql
    license: not_applicable
    query_hint: SELECT ?item WHERE { ?item wdt:P31 wd:Q16970 ; wdt:P149 wd:Q176483 }
  - kind: object_type
    title: Church stall / choir screen board construction
    title_tr: Kilise oturma sırası / koro bölmesi ahşap konstrüksiyonu
    date: 14.-16. yy
    region: Kuzey Avrupa
    why_relevant: Direct precedent for tall, narrow, boarded, chamfered wooden furniture with vertical rhythm.
    what_to_extract:
      - board thickness-to-height ratio
      - chamfer profile on arris
      - blade spacing rhythm
    source_api: rijksmuseum
    license: public_domain
    query_hint: 'Rijksmuseum API: f.type=wood&s=choir+stall&imgonly=True (CC0 filter)'
