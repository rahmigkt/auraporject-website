# =============================================================================
# FDE / styles / gothic_minimalism.yaml
# Gotik Minimalizm — hibrit sanat stili profili
# Şema: ../schemas/style_ontology.schema.json (v1.0.0)
#
# TEMEL FİKİR:
#   Gotik dikeylik + sivri kemer + gölge + taş/ahşap/metin sertliği + ritüel sessizlik
#   MINIMALİZM azaltma + boşluk + malzeme dürüstlüğü + süsleme disiplini
#   => "Katedrali oyma, katedrali azalt."
#
# scoring_signature.match_threshold = 0.60 (blend formülüyle kalibre edildi;
# referans ölçüm: tools/reference_scorer.py --demo -> 93.6/100 iyi örnek)
# =============================================================================

schema_version: '1.0.0'
style_id: gothic_minimalism
name: Gothic Minimalism
name_tr: Gotik Minimalizm
family: hybrid
era: 2019–günümüz (spekülatif/çağdaş hibrit)
origin_regions:
  - Kuzey Avrupa
  - Japonya (minimalist disiplin etkisi)
  - çağdaş galeri mobilyası
description: 'Gothic Minimalism is a hybrid furniture language that keeps the vertical aspiration, pointed arch geometry, chiaroscuro and material severity of Gothic architecture while enforcing the reduction, negative space, material honesty and ornament discipline of minimalism. The result is furniture that behaves like a secular reliquary: monolithic yet skeletal, dark yet calm, sculptural yet strictly usable. Ornament is never applied; it is generated by structure, shadow and a single material gesture. '
description_tr: 'Gotik Minimalizm; gotik mimarinin dikey yükselişini, sivri kemer geometrisini, gölge oyununu ve malzeme sertliğini alır, minimalizmin azaltma / boşluk / malzeme dürüstlüğü / süsleme disiplini ile disipline eder. Sonuç: dinsel olmayan bir kutsal nesne gibi davranan mobilya — kütlesel ama iskeletsel, karanlık ama sakin, heykelsi ama kesinlikle kullanılabilir. Süsleme asla uygulanmaz; yapı, gölge ve tek bir malzeme jesti tarafından üretilir. '
# -----------------------------------------------------------------------------
# ÇEKİRDEK İLKELER (ağırlıklı, test_edilebilir)
core_principles:
  - id: vertical_aspiration
    statement: 'Every piece must read as ascending: dominant vertical axis, height-to-width bias upward.'
    statement_tr: 'Her parça yükseliyor gibi okunmalı: baskın dikey eksen, yükseklik/genişlik oranı yukarı doğru.'
    weight: 1.0
    testable_via: [verticality, height_width_bias, leg_verticality]
  - id: pointed_arch_as_structure
    statement: The pointed arch (ogive) is used as a load-bearing or void-defining geometry, never as an applied sticker.
    statement_tr: Sivri kemer (ogive) taşıyıcı veya boşluk tanımlayıcı geometri olarak kullanılır; asla yapıştırılmış dekor değil.
    weight: 0.95
    testable_via:
      - pointed_arch_presence
      - structural_expression
      - ornament_is_structural
  - id: reduction_to_essence
    statement: Remove every element whose absence does not change function or shadow. Target 3-7 primary parts.
    statement_tr: Yokluğu işlevi veya gölgeyi değiştirmeyen her elemanı çıkar. Hedef 3-7 ana parça.
    weight: 0.95
    testable_via: [minimalism_index, part_count_leanness, ornament_restraint]
  - id: material_honesty
    statement: 'One material must speak truthfully: stone is stone, blackened oak is oak, steel is steel. No faux finishes, no printed grain.'
    statement_tr: 'Bir malzeme dürüstçe konuşmalı: taş taş, karartılmış meşe meşe, çelik çelik. Sahte kaplama ve baskı damar yok.'
    weight: 0.9
    testable_via: [material_honesty, faux_finish_absence]
  - id: chiaroscuro_as_ornament
    statement: Shadow is the primary decorative medium. Forms are shaped to cast deep, legible shadow lines.
    statement_tr: Gölge birincil süsleme aracıdır. Formlar derin ve okunabilir gölge çizgileri düşürecek şekilde biçimlenir.
    weight: 0.9
    testable_via: [contrast_ratio, shadow_as_design_element, dark_materiality]
  - id: ritual_silence
    statement: 'The object should feel like it belongs in a silent room: low saturation, no gloss, no visual noise, generous void.'
    statement_tr: 'Nesne sessiz bir odaya aitmiş gibi hissettirmeli: düşük doygunluk, parlaklık yok, görsel gürültü yok, cömert boşluk.'
    weight: 0.85
    testable_via: [low_key_palette, ritual_stillness, void_ratio, gloss_absence]
  - id: sculptural_but_usable
    statement: It may look like sculpture, but it must pass ergonomic and load checks without exception.
    statement_tr: Heykel gibi görünebilir ama ergonomi ve taşıma kontrollerini istisnasız geçmek zorundadır.
    weight: 1.0
    testable_via: [ergonomic_compliance, structural_plausibility]
  - id: single_gesture_rule
    statement: At most ONE expressive gesture per piece (one arch, one chamfer line, one metal inlay). Everything else is silent.
    statement_tr: Parça başına en fazla BİR ifade jesti (bir kemer, bir pah çizgisi, bir metal kakma). Gerisi sessiz.
    weight: 0.8
    testable_via: [ornament_restraint, gesture_count]
# -----------------------------------------------------------------------------
# FORM DİLİ
forms:
  silhouettes:
    - tall narrow monolith with a single ogival void
    - 'skeletal frame: thin verticals + pointed arch head'
    - plinth-based slab with sharply chamfered top edge
    - cage / reliquary volume with vertical blade slats
    - cantilevered slab anchored to a heavy base
    - tapered leg set splaying slightly outward (0-3°)
  geometry_language:
    - ogive / pointed arch (two-centred arc)
    - lancet proportion (1:2.5 to 1:4 width-to-height of openings)
    - chamfer (45° arris) instead of roundover
    - strict orthogonal primary frame
    - vertical blade rhythm (constant pitch, 30-70 mm)
    - keel / ridge line as a single crest
    - tracery reduced to 2-3 structural ribs only
  line_quality:
    - long unbroken verticals
    - crisp hard edges, 0-2 mm radius maximum
    - no freehand curves, no organic wobble
  edge_treatment:
    - 45° chamfer, 3-8 mm, consistent around the piece
    - shadow gap / reveal (6-10 mm) between volumes
    - knife edge on stone and metal tops
  mass_vs_void: 'Heavy base, light top. Void is compositional, not leftover: 25-45% of the frontal envelope should be readable negative space.'
  preferred_archetypes:
    - chair
    - armchair
    - sideboard
    - bookshelf
    - shelf_unit
    - console_table
    - coffee_table
    - headboard
    - bench
    - coat_rack
    - cabinet
  forbidden_forms:
    - cabriole leg
    - bulbous turned foot
    - S-curve / ogee body profile
    - round arch (Romanesque) as the dominant opening
    - quatrefoil / rose window tracery applied as surface decoration
    - puffy quilted upholstery
    - floating weightless look with no base logic
# -----------------------------------------------------------------------------
# MALZEMELER (primary / secondary / accent / forbidden / combination_rules)
materials:
  primary:
    - material_id: blackened_oak
      material_tr: Karartılmış meşe
      finish: blackened
      why: Deep low-reflectance grain; carries verticality and shadow without decoration.
      why_tr: Derin, düşük yansımalı damar; süslemesiz dikeylik ve gölge taşır.
      applies_to_parts: [frame, leg, rail, panel, post, shelf]
      cost_tier: 3
      weight: 1.0
    - material_id: concrete_cast
      material_tr: Dökme beton
      finish: raw
      why: Stone severity, monolithic mass, honest pore texture.
      why_tr: Taş sertliği, kütlesel ağırlık, dürüst gözenek dokusu.
      applies_to_parts: [base_plinth, top_surface, panel, leg]
      cost_tier: 3
      weight: 0.8
    - material_id: limestone_honed
      material_tr: Honlu kireçtaşı
      finish: honed
      why: Direct reference to cathedral masonry; matte, pale-grey, quiet.
      why_tr: Katedral taş işçiliğine doğrudan referans; mat, açık gri, sessiz.
      applies_to_parts: [top_surface, base_plinth, panel]
      cost_tier: 4
      weight: 0.55
    - material_id: steel_blackened
      material_tr: Karartılmış çelik
      finish: blackened
      why: Allows the skeletal lancet frame at minimal section (8-16 mm).
      why_tr: İskeletsel lancet çerçeveyi minimum kesitte (8-16 mm) mümkün kılar.
      applies_to_parts: [frame, leg, stretcher, rail, hardware]
      cost_tier: 3
      weight: 0.75
  secondary:
    - material_id: solid_walnut
      material_tr: Masif ceviz
      finish: oiled
      why: Warm counterpoint; prevents the palette from becoming cold costume.
      why_tr: Sıcak karşıtlık; paletin soğuk bir kostüme dönüşmesini engeller.
      applies_to_parts: [top_surface, shelf, drawer_front, seat]
      cost_tier: 4
      weight: 0.5
    - material_id: glass_smoked
      material_tr: Füme cam
      finish: polished
      why: 'Void made physical: transparency as negative space with a shadow edge.'
      why_tr: 'Fizikselleşmiş boşluk: negatif alan olarak şeffaflık, gölge kenarıyla.'
      applies_to_parts: [door, shelf, panel, top_surface]
      cost_tier: 3
      weight: 0.35
    - material_id: wool_felt_dark
      material_tr: Koyu yün keçe
      finish: raw
      why: Acoustic softness, matte, absorbs light — the only permitted softness.
      why_tr: Akustik yumuşaklık, mat, ışığı emer — izin verilen tek yumuşaklık.
      applies_to_parts: [seat, cushion, padding, panel]
      cost_tier: 2
      weight: 0.4
  accent:
    - material_id: brass_aged
      material_tr: Eskitilmiş pirinç
      finish: patinated
      why: 'One small relic-light: hardware, inlay line, or foot cap only. Max 3% of surface.'
      why_tr: 'Tek bir küçük kutsal ışık: yalnızca donanım, kakma çizgisi veya ayak pabucu. Yüzeyin en fazla %3''ü.'
      applies_to_parts: [hardware, joint, foot, edge_treatment]
      cost_tier: 4
      weight: 0.9
    - material_id: bronze_patinated
      material_tr: Patinalı bronz
      finish: patinated
      why: Cast node or single crest detail; ages like liturgical metal.
      why_tr: Döküm düğüm veya tek tepe detayı; ayin metali gibi yaşlanır.
      applies_to_parts: [joint, ornament, foot]
      cost_tier: 5
      weight: 0.5
  forbidden_materials:
    - high-gloss lacquer (piano black included)
    - chrome / mirror polished steel
    - pastel or neon coloured plastic
    - melamine with printed wood grain
    - acrylic in bright colours
    - velvet in saturated jewel tones
    - faux marble laminate
    - rattan / cane webbing (reads tropical, breaks severity)
    - reclaimed pallet wood with visible branding
  combination_rules:
    - pair:
        - blackened_oak
        - brass_aged
      verdict: signature
      note: Dark wood + one aged metal line = core identity of the style.
    - pair:
        - concrete_cast
        - blackened_oak
      verdict: signature
      note: Mass vs. grain; keep concrete below, wood above.
    - pair:
        - steel_blackened
        - glass_smoked
      verdict: allowed
      note: Full skeletal-reliquary mode; risk of looking like a vitrine — keep proportions ecclesiastical (tall/narrow).
    - pair:
        - limestone_honed
        - wool_felt_dark
      verdict: allowed
      note: Stone seat softened by felt pad; good for benches.
    - pair:
        - blackened_oak
        - chrome
      verdict: forbidden
      note: Chrome destroys chiaroscuro and reads 1990s office.
    - pair:
        - concrete_cast
        - pastel_plastic
      verdict: forbidden
      note: Contradicts material severity and low-key palette.
  material_honesty_rules:
    - Stone must be real stone or honest cast concrete — no stone-effect laminate.
    - If a piece looks carved, it must be milled/carved, not printed or moulded with fake tool marks.
    - Solid sections must be solid; hollow sections must be declared in the BOM.
    - Blackening must be a chemical/thermal process (fumed, ebonised, black oxide) — not opaque paint hiding grain.
# -----------------------------------------------------------------------------
# RENK
colors:
  palette:
    - { hex: '#0E0E10', name: Vant-ish Charcoal, name_tr: Kömür Siyahı, role: dominant, max_coverage: 0.45 }
    - { hex: '#2B2724', name: Blackened Oak, name_tr: Karartılmış Meşe, role: dominant, max_coverage: 0.35 }
    - { hex: '#4A4741', name: Warm Graphite, name_tr: Sıcak Grafit, role: secondary, max_coverage: 0.2 }
    - { hex: '#8C8880', name: Limestone Ash, name_tr: Kireçtaşı Külü, role: secondary, max_coverage: 0.15 }
    - { hex: '#B8B2A6', name: Cathedral Linen, name_tr: Katedral Keteni, role: highlight, max_coverage: 0.08 }
    - { hex: '#6E5A32', name: Aged Brass, name_tr: Eskitilmiş Pirinç, role: accent, max_coverage: 0.03 }
    - { hex: '#1A1410', name: Reliquary Shadow, name_tr: Rölike Gölgesi, role: shadow, max_coverage: 0.3 }
  value_range: low-key; 8-45 L* for 85% of the object, single highlight up to 70 L*
  saturation_range: very low; C* < 8 for all neutrals, brass accent C* 18-30 max
  contrast_rule: High value contrast between light and shadow, but LOW chromatic contrast. Contrast must come from geometry+light, never from colour pairs.
  forbidden_colors:
    - pastel pink / mint / baby blue
    - neon or fluorescent any hue
    - saturated red, orange, purple, teal
    - pure white
    - gold metallic foil / glitter
    - multicolour or gradient finishes
# -----------------------------------------------------------------------------
# DOKU
textures:
  dominant:
    - open-pore brushed timber grain, vertical orientation
    - fine pore structure of cast concrete / board-formed concrete imprint
    - honed stone micro-roughness
    - black oxide matte metal
  contrast_textures:
    - single polished edge that catches one light line (chamfer arris)
    - dense wool felt as the only light-absorbing soft field
    - hand-forged hammer facets limited to one component
  scale_of_texture: fine
  reflectance_profile: 85% matte (gloss < 10 units), 10% satin, max 5% controlled sheen on a single arris
  forbidden_textures:
    - high gloss / mirror
    - quilted or buttoned tufting
    - shaggy long-pile fur
    - printed graphic pattern
    - distressed shabby-chic scraping
    - glossy resin / epoxy river
# -----------------------------------------------------------------------------
# SÜSLEME KURALLARI
ornament_rules:
  max_level: subtle
  allowed:
    - chamfer lines that create shadow grooves
    - shadow gap / reveal between two volumes
    - vertical blade rhythm (structural slats)
    - a single ogival opening (void as ornament)
    - one metal inlay line, 2-6 mm wide, max one per piece
    - hand-planed facet on one visible face
    - subtle fluting with pitch >= 40 mm and depth <= 4 mm
  discouraged:
    - repeated carved motifs across more than one component
    - engraved lettering or iconography
    - applied mouldings / added trim
    - inlay covering more than 3% of a surface
  forbidden:
    - baroque or rococo scrollwork
    - full gothic tracery, rose windows, quatrefoils, crockets, finials applied as decoration
    - religious figurative imagery (saints, crucifix, iconography)
    - carved foliage covering panels
    - turnery beads, reeding, gadrooning
    - any gilding
    - decals, transfers, laser-etched logos
  placement_rules:
    - Ornament may only occur where structure already needs a transition (joint, edge, apex).
    - Never on the seating surface or any user-contact plane.
    - Never on more than one component per piece.
    - Vertical placement only in the upper third (the 'ascension zone').
  motif_vocabulary:
    - ogive outline
    - lancet void
    - chamfer arris
    - keel ridge
    - blade rhythm
    - single nail head / forged pin as a dot of light
  ornament_must_be:
    - structural
    - shadow-casting
    - single-accent
    - non-figurative
    - reproducible by machine process
# -----------------------------------------------------------------------------
# ORANLAR
proportions:
  dominant_direction: vertical
  ratio_presets:
    - name: lancet opening
      value: 3.2
      applies_to: void height / void width in arches, door openings, shelf bays
    - name: overall elevation (tall storage)
      value: 2.2
      applies_to: total height / total width for sideboard, cabinet, shelf_unit
    - { name: chair back height ratio, value: 1.9, applies_to: total height / seat width for chair }
    - { name: plinth to body, value: 0.12, applies_to: base plinth height / total height }
    - name: leg section slenderness
      value: 14.0
      applies_to: leg height / leg section width (upper bound 22 for wood, 30 for steel)
    - { name: blade pitch to blade width, value: 1.6, applies_to: slat centre-to-centre / slat width }
  module_grid_mm: 32
  leg_to_body_ratio: legs 8-18% of total height for casegoods; 55-70% for chairs (high seat-clearance look)
  seat_height_bias: 'standard-to-low: 420-450 mm (chair), 380-420 mm (bench), 340-380 mm (lounge)'
  void_ratio_target: 0.35
  scale_bias: generous
  symmetry_preference: strict_bilateral
# -----------------------------------------------------------------------------
# IŞIK VE GÖLGE (render direktifleri dahil)
lighting_and_shadow:
  light_direction:
    - high side light 45-60° from one side
    - single narrow window source
    - top-down raking light
  light_quality: hard, directional, low fill; colour temperature 2700-3500K; single source only
  shadow_role: Primary ornament. Every chamfer, blade and arch must cast a legible shadow line. Design the shadow before the surface.
  highlight_strategy: One specular line along a single arris or metal inlay; nowhere else.
  render_notes: 'Render on a dark neutral backdrop (#1A1A1C), no environment clutter, no props, no people. Camera at 100-135 cm height, 35-50 mm equivalent, slight low angle to exaggerate verticality. Exposure -0.7 EV. Deep shadows retained, never lifted. Photoreal, matte surfaces, subtle dust in the light beam allowed. '
# -----------------------------------------------------------------------------
# DUYGUSAL ANAHTAR KELİMELER
emotional_keywords:
  - reverent
  - silent
  - austere
  - ascendant
  - monastic
  - shadowed
  - severe
  - contemplative
  - reliquary-like
  - unhurried
emotional_keywords_tr:
  - hürmetkâr
  - sessiz
  - çileci
  - yükselen
  - manastırvari
  - gölgeli
  - sert
  - tefekkürlü
  - rölike gibi
  - acelesiz
# -----------------------------------------------------------------------------
# YASAK SİNYALLER (hard = tasarım reddedilir, soft = skor düşer)
forbidden_signals:
  - id: fb_baroque_complexity
    signal: Dense layered carving, scrolls, acanthus, multiple ornamental systems on one piece.
    signal_tr: Yoğun katmanlı oyma, kıvrımlar, akantus; tek parçada birden fazla süsleme sistemi.
    severity: hard
    detected_by: [ornament_density, gesture_count]
  - id: fb_pastel_plastic
    signal: Pastel or neon plastic, glossy acrylic, injection-moulded bright components.
    signal_tr: Pastel veya neon plastik, parlak akrilik, enjeksiyon parlak parçalar.
    severity: hard
    detected_by: [low_key_palette, gloss_absence, material_honesty]
  - id: fb_gloss
    signal: High-gloss lacquer, chrome, mirror surfaces, reflective sheen over >10% of the object.
    signal_tr: Yüksek parlak lake, krom, ayna yüzeyler; nesnenin %10'undan fazlasında yansıma.
    severity: hard
    detected_by: [gloss_absence, reflectance_profile]
  - id: fb_horizontal_dominance
    signal: Wide-low horizontal massing with no vertical element; squat proportions.
    signal_tr: Dikey eleman içermeyen geniş-alçak yatay kütle; bodur oranlar.
    severity: hard
    detected_by: [verticality, height_width_bias]
  - id: fb_round_arch_only
    signal: Romanesque semicircular arch used as the only opening geometry.
    signal_tr: Tek açıklık geometrisi olarak Romanesk yarım daire kemer.
    severity: soft
    detected_by: [pointed_arch_presence, curvature_organic]
  - id: fb_tropical_warmth
    signal: Rattan, cane, bamboo, teak-oiled honey tones, beach/resort mood.
    signal_tr: Rattan, hasır, bambu, tik yağlı bal tonları, plaj/tatil havası.
    severity: hard
    detected_by: [warmth_index, material_honesty]
  - id: fb_religious_literalism
    signal: Literal religious symbols, crosses, saints, stained-glass imagery, liturgical objects.
    signal_tr: Literal dini semboller, haç, aziz figürleri, vitray imagery, ayin nesneleri.
    severity: hard
    detected_by: [figurative_ornament]
  - id: fb_shabby_distress
    signal: Artificial distressing, whitewash, chipped paint, farmhouse/rustic styling.
    signal_tr: Yapay eskitme, beyaz badana, soyulmuş boya, çiftlik/rustik stil.
    severity: hard
    detected_by: [handcraft_index, material_honesty]
  - id: fb_soft_organic
    signal: Blobby organic forms, freehand curves, amoeba silhouettes, plush rounded upholstery.
    signal_tr: Yumuşak organik formlar, serbest eğriler, amip siluetleri, tombul yuvarlak döşeme.
    severity: hard
    detected_by: [curvature_organic, geometric_strictness]
  - id: fb_part_bloat
    signal: More than 8 primary parts or redundant purely-decorative members.
    signal_tr: 8'den fazla ana parça veya tamamen dekoratif gereksiz elemanlar.
    severity: soft
    detected_by: [part_count_leanness, minimalism_index]
  - id: fb_color_pop
    signal: Any saturated colour accent beyond the single brass-family metal.
    signal_tr: Tek pirinç ailesi metal dışında doygun renk vurgusu.
    severity: hard
    detected_by: [low_key_palette, chroma_restraint]
  - id: fb_copyright_copy
    signal: Silhouette recognisably identical to a known designer piece or a specific historic monument.
    signal_tr: Siluetin bilinen bir tasarımcı parçasıyla veya belirli bir tarihi anıtla tanınabilir biçimde aynı olması.
    severity: hard
    detected_by: [originality_check]
# -----------------------------------------------------------------------------
# POZİTİF PROMPT TOKEN'LARI
positive_prompt_tokens:
  core:
    - gothic minimalist furniture
    - secular reliquary object
    - monastic austerity
    - contemporary gallery furniture
  form:
    - tall vertical proportions
    - pointed ogival arch void
    - lancet openings
    - 45 degree chamfered arris
    - skeletal blackened frame
    - vertical blade rhythm
    - heavy plinth base, floating upper volume
    - shadow gap reveal between volumes
    - strict bilateral symmetry
    - monolithic slab top with knife edge
  material:
    - blackened oak, open pore, vertical grain
    - board-formed cast concrete
    - honed limestone
    - black oxide steel
    - single aged brass inlay line
    - dark wool felt seat pad
    - smoked glass panel
  light:
    - single hard directional light from high side window
    - deep chiaroscuro
    - long legible cast shadows
    - one specular highlight along a single arris
    - low fill, retained shadow detail
    - 2700K warm candle-adjacent temperature
  camera:
    - 35mm lens, eye level 110cm
    - slight low angle to emphasise verticality
    - front three-quarter view
    - clean dark studio backdrop
    - no props, no people, no clutter
  mood:
    - ritual silence
    - cathedral calm
    - austere contemplation
    - unhurried permanence
    - dark but serene
  quality:
    - photorealistic product photography
    - physically accurate materials
    - sharp joinery detail
    - visible craftsmanship
    - 8k, high dynamic range, matte finish
  weight_hint:
    core: 1.3
    form: 1.2
    material: 1.2
    light: 1.1
    mood: 1.0
    camera: 0.9
    quality: 1.0
  template: '{subject}, {form}, {material}, {light}, {mood}, {camera}, {quality}'
