# PARÇA DİREKTİFLERİ — her parça bu stilde nasıl davranır?
# part_role değerleri schemas/furniture_parts.schema.json -> $defs.partRoleId
part_directives:
  - part_role: frame
    directive: One continuous tube path where possible; constant OD 20-32 mm; bend radius >= 2x OD; nodes welded and ground.
    directive_tr: Mümkünse tek sürekli boru yolu; sabit dış çap 20-32 mm; büküm yarıçapı >= 2x çap; düğümler kaynaklı ve taşlanmış.
    typical_material: steel_chromed_tube
    typical_dimension_hint: OD 25mm, wall 1.5mm, R100
    ornament_level: none
    priority: must
  - part_role: leg
    directive: Straight tube or a single-radius cantilever runner. No taper, no foot ornament; optional black nylon glide 8 mm.
    directive_tr: Düz boru veya tek yarıçaplı konsol ayağı. Koniklik yok, ayak süsü yok; opsiyonel 8 mm siyah naylon kaydırıcı.
    typical_material: steel_chromed_tube
    typical_dimension_hint: OD 22-25mm; chair leg height 430-470mm
    ornament_level: none
    priority: must
  - part_role: seat
    directive: 'Flat plane: 10-14 mm birch ply, woven cane, or taut canvas laced into the frame rebate. No padding over 20 mm.'
    directive_tr: 'Düz düzlem: 10-14 mm huş kontrplak, dokuma hasır veya çerçeve yuvasına gerilmiş kanvas. 20 mm üstü dolgu yok.'
    typical_material: cane_webbing
    typical_dimension_hint: seat height 440-470mm; depth 400-440mm
    ornament_level: none
    priority: must
  - part_role: back_support
    directive: Flat plane or a single gentle curve (one radius only). Height 300-450 mm above seat. No lumbar bulge, no headrest.
    directive_tr: Düz düzlem veya tek hafif eğri (yalnızca bir yarıçap). Oturmadan 300-450 mm yukarıda. Bel çıkıntısı ve baş dayama yok.
    typical_material: plywood_birch
    typical_dimension_hint: back height 300-450mm above seat; recline 95-105°
    ornament_level: none
    priority: must
  - part_role: arm_support
    directive: Either a continuous extension of the frame tube, or a flat ply pad on the tube. Height 200-230 mm above seat.
    directive_tr: Ya çerçeve borusunun sürekli uzantısı ya boru üzerinde düz kontrplak ped. Oturmadan 200-230 mm yukarıda.
    typical_material: steel_chromed_tube
    typical_dimension_hint: arm height 640-680mm from floor
    ornament_level: none
    priority: should
  - part_role: top_surface
    directive: 12-20 mm ply, 10-12 mm tempered glass, or 18-25 mm solid-core panel. Square edge, no bullnose, no bevel ornament.
    directive_tr: 12-20 mm kontrplak, 10-12 mm temperli cam veya 18-25 mm masif özlü panel. Keskin kenar, yuvarlatma ve pah süsü yok.
    typical_material: plywood_birch
    typical_dimension_hint: table height 720-750mm; overhang 30-60mm
    ornament_level: none
    priority: must
  - part_role: shelf
    directive: Constant bay module (300/360/400 mm), 18 mm ply, span <= 700 mm, adjustable on a 32 mm system hole line.
    directive_tr: Sabit göz modülü (300/360/400 mm), 18 mm kontrplak, açıklık <= 700 mm, 32 mm sistem delik hattında ayarlanabilir.
    typical_material: plywood_birch
    typical_dimension_hint: 18mm thick; 32mm system holes at 32mm pitch
    ornament_level: none
    priority: must
  - part_role: panel
    directive: Flat, unframed, colour-zoned. One saturated component maximum per piece.
    directive_tr: Düz, çerçevesiz, renk bölgeli. Parça başına en fazla bir doygun bileşen.
    typical_material: lacquer_primary_red
    typical_dimension_hint: 12-18mm; colour zone <= 8% of total area
    ornament_level: none
    priority: should
  - part_role: hardware
    directive: Visible black or chrome cap nuts/bolts on a regular grid; no decorative handles — use a 20 mm finger recess or a tube-pull.
    directive_tr: Düzenli ızgarada görünür siyah veya krom kapak somun/cıvata; dekoratif kulp yok — 20 mm parmak oyuk veya boru çekme kullan.
    typical_material: steel_black_powder_coated
    typical_dimension_hint: M6/M8; recess 20x40mm
    ornament_level: none
    priority: must
  - part_role: joint
    directive: 'Celebrated as a graphic node: visible weld seam or exposed bolt. Never hidden behind filler or trim.'
    directive_tr: 'Grafik düğüm olarak kutlanır: görünür kaynak dikişi veya açık cıvata. Asla macun veya çıta arkasına gizlenmez.'
    typical_material: steel_chromed_tube
    typical_dimension_hint: node diameter <= 1.4 x tube OD
    ornament_level: none
    priority: must
  - part_role: stretcher
    directive: Only if structurally required; a single straight tube at 1/3 height. Cantilever frames omit it entirely.
    directive_tr: Yalnızca yapısal gereklilikte; 1/3 yükseklikte tek düz boru. Konsol çerçevelerde tamamen kaldırılır.
    typical_material: steel_chromed_tube
    typical_dimension_hint: OD 16-22mm
    ornament_level: none
    priority: may
  - part_role: upholstery
    directive: 'Thin, taut, flat: 8-20 mm foam under canvas or leather, no piping, no buttons, single perimeter seam.'
    directive_tr: 'İnce, gergin, düz: kanvas veya deri altında 8-20 mm sünger; biye, düğme yok, tek çevre dikişi.'
    typical_material: canvas_waxed
    typical_dimension_hint: 8-20mm total pad
    ornament_level: none
    priority: should
  - part_role: edge_treatment
    directive: Square edge with 1 mm break only (safety, not decoration). Ply edges sanded and sealed, laminations visible.
    directive_tr: Yalnızca 1 mm kırıklı keskin kenar (güvenlik, süs değil). Kontrplak kenarları zımparalı ve mühürlü, katmanlar görünür.
    typical_material: null
    typical_dimension_hint: 1mm arris break
    ornament_level: none
    priority: must
# -----------------------------------------------------------------------------
# CANLI ÇİZİM GERİ BİLDİRİM CÜMLELERİ
sketch_feedback:
  on_good_signal:
    - 'Continuous tube path detected — that is the correct Bauhaus logic: one line, bent, not assembled from many sticks.'
    - Bend radius is 4x the tube diameter. Clean and bendable.
    - Colour is confined to one functional plane. Correct zoning.
    - Grid bays are constant. Modularity reads well.
  on_weak_signal:
    - Frame is broken into many short members. Try to merge them into one continuous tube run.
    - Void ratio is low — the piece reads heavy. Remove a panel or thin the section.
    - Two saturated colours compete. Pick one zone.
  on_violation:
    - Organic curve detected. Bauhaus curvature must be a single constant radius, not freehand.
    - Carved/turned profile detected. This style has zero ornament budget.
    - Stone or concrete mass detected. The style requires weightlessness and machine logic.
    - Taper found on a tube member. Tube must be constant section.
    - Bend radius is sharper than 2x OD — this cannot be manufactured without wrinkling.
    - Load path from seat to floor is not continuous. Add a node or a stretcher.
  on_violation_tr:
    - Organik eğri tespit edildi. Bauhaus eğriliği sabit tek yarıçap olmalı, serbest el değil.
    - Oyma/torna profil tespit edildi. Bu stilin süsleme bütçesi sıfırdır.
    - Taş veya beton kütle tespit edildi. Stil ağırlıksızlık ve makine mantığı gerektirir.
    - Boru elemanda koniklik bulundu. Boru sabit kesitli olmalı.
    - Büküm yarıçapı 2x çaptan keskin — buruşmadan üretilemez.
    - Oturmadan zemine yük yolu kesintisiz değil. Bir düğüm veya kiriş ekle.
  suggested_next_strokes:
    - 'Draw the continuous tube path in one stroke: floor -> back -> seat -> floor.'
    - Add the flat seat plane as a single rectangle.
    - Insert a 32 mm module grid for the storage bays.
    - Mark one component in a primary colour.
# -----------------------------------------------------------------------------
# STİL UYUMLULUĞU VE HİBRİT TARİFLERİ
compatibility:
  blends_well_with: [high_tech, de_stijl, minimalism, scandinavian_modern, industrial]
  conflicts_with:
    - gothic_minimalism
    - art_deco
    - rococo_revival
    - wabi_sabi
    - memphis
    - dark_academia
    - tropical_resort
  hybrid_recipes:
    - result_style_id: bauhaus_hightech
      mix:
        - { style_id: bauhaus, ratio: 0.6 }
        - { style_id: high_tech, ratio: 0.4 }
      note: Keep tube logic, add tension cables and visible adjustment mechanisms; swap chrome for anodised aluminium.
    - result_style_id: bauhaus_japandi
      mix:
        - { style_id: bauhaus, ratio: 0.5 }
        - { style_id: japandi, ratio: 0.5 }
      note: Soften chrome to matte black, replace cane with light oak slats, drop saturated colour to a single muted ochre.
# -----------------------------------------------------------------------------
# YASAL / ETİK UYUM
compliance:
  cultural_sensitivity_notes: No religious or political symbolism. Bauhaus was politically suppressed in 1933 — avoid any iconography that references that history literally.
  religious_symbol_policy: forbidden_as_content
  do_not_replicate:
    - canonical named chairs (recognisable authorial silhouettes) — extract the TYPE logic only
    - any specific museum object under a no-derivatives licence
