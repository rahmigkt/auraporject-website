# STİL UYUMLULUĞU VE HİBRİT TARİFLERİ
compatibility:
  blends_well_with:
    - wabi_sabi
    - scandinavian_modern
    - minimalism
    - muji_modern
    - craft_modern
  conflicts_with:
    - brutalism
    - gothic_minimalism
    - art_deco
    - memphis
    - high_tech
    - rococo_revival
    - dark_academia
  hybrid_recipes:
    - result_style_id: gothic_japandi
      mix:
        - { style_id: gothic_minimalism, ratio: 0.5 }
        - { style_id: japandi, ratio: 0.5 }
      note: Keep the lancet void and chamfer discipline from gothic; lighten the palette to 40-65 L*, swap concrete for smoked oak, keep shadow soft rather than dramatic.
    - result_style_id: japandi_wabisabi
      mix:
        - { style_id: japandi, ratio: 0.7 }
        - { style_id: wabi_sabi, ratio: 0.3 }
      note: Allow more grain variation, hand-planed marks, one repaired/patched detail; drop gloss_absence gate to 0.85.
# -----------------------------------------------------------------------------
# YASAL / ETİK UYUM
compliance:
  cultural_sensitivity_notes: '"Japandi" is a commercial hybrid term, not a Japanese tradition. Do not use religious or sacred Japanese objects (butsudan cabinets, torii forms, temple fittings) as decorative motifs. Use construction logic (joinery, slat rhythm, proportion), not sacred iconography. Attribute the joinery tradition correctly and avoid presenting it as a generic "exotic" aesthetic. '
  religious_symbol_policy: forbidden_as_content
  do_not_replicate:
    - named Scandinavian designer chair silhouettes
    - specific kumiko patterns that are the signature of an identified workshop
    - temple/shrine architectural elements as furniture decoration
