# =============================================================================
# FDE / styles / japandi.yaml   (schema: ../schemas/style_ontology.schema.json v1.0.0)
# İskandinav işlevsel sıcaklığı + Japon birleşim disiplini + wabi-sabi
# match_threshold = 0.60
# =============================================================================

schema_version: '1.0.0'
style_id: japandi
name: Japandi
name_tr: Japandi (Japon-İskandinav sentezi)
family: hybrid
era: '2016-günümüz (ticari akım); kökler: 1950''ler İskandinav modern + Japon geleneksel marangozluk'
origin_regions: [İskandinavya, Japonya]
description: 'Japandi fuses Scandinavian functional warmth with Japanese joinery discipline and wabi-sabi acceptance of imperfection. Light, low, quiet furniture: pale woods, matte surfaces, round-but-restrained edges, visible hand-cut joints, low seat heights, generous emptiness. Contrast comes from one dark element, a textural pairing (smooth wood vs. rough linen), and the softness of daylight — never from ornament, gloss or saturated colour. '
description_tr: 'Japandi, İskandinav işlevsel sıcaklığını Japon birleşim ustalığı ve wabi-sabi''nin kusuru kabulüyle birleştirir. Açık renkli ahşaplar, mat yüzeyler, yuvarlatılmış ama ölçülü kenarlar, görünür el işi birleşimler, alçak oturma yükseklikleri, cömert boşluk. Karşıtlık; tek bir koyu elemandan, dokusal eşleşmeden (pürüzsüz ahşap ve kaba keten) ve gün ışığının yumuşaklığından gelir — asla süslemeden, parlaklıktan veya doygun renkten değil. '
# -----------------------------------------------------------------------------
# ÇEKİRDEK İLKELER (ağırlıklı, test_edilebilir)
core_principles:
  - id: quiet_function
    statement: Every element serves a daily ritual (sitting, pouring, folding). Nothing exists to impress.
    statement_tr: Her eleman günlük bir ritüele hizmet eder (oturma, dökme, katlama). Hiçbir şey etkilemek için var olmaz.
    weight: 1.0
    testable_via: [minimalism_index, part_count_leanness, sculptural_index]
  - id: pale_and_warm
    statement: Dominant palette is light, warm-neutral wood (L* 55-78) with one dark anchor element.
    statement_tr: Baskın palet açık, sıcak-nötr ahşaptır (L* 55-78) ve tek bir koyu çapa eleman bulunur.
    weight: 0.9
    testable_via: [warmth_index, low_key_palette, contrast_ratio]
  - id: joinery_as_detail
    statement: 'The joint is the only decoration: visible hand-cut or precisely machined connection.'
    statement_tr: 'Birleşim tek süslemedir: görünür el işi veya hassas makine bağlantısı.'
    weight: 0.9
    testable_via: [handcraft_index, structural_expression, ornament_density]
  - id: low_and_grounded
    statement: Furniture sits low to the floor; visual centre of gravity is below 500 mm.
    statement_tr: Mobilya zemine alçak oturur; görsel ağırlık merkezi 500 mm'nin altındadır.
    weight: 0.85
    testable_via: [lightness_visual, massiveness, seat_height_bias]
  - id: imperfect_perfection
    statement: Small natural variation is allowed (grain, knot, slight colour shift); defects are not.
    statement_tr: Küçük doğal varyasyon kabul edilir (damar, budak, hafif renk değişimi); kusur edilmez.
    weight: 0.75
    testable_via: [material_honesty, handcraft_index]
  - id: generous_void
    statement: Empty space around and within the object is designed, not leftover.
    statement_tr: Nesnenin çevresindeki ve içindeki boşluk tasarlanmıştır, artakalan değildir.
    weight: 0.85
    testable_via: [void_ratio, minimalism_index]
  - id: soft_light_only
    statement: Diffused daylight, no hard shadow drama. Shadow is soft, short and gentle.
    statement_tr: Yumuşak gün ışığı, sert gölge dramı yok. Gölge yumuşak, kısa ve naziktir.
    weight: 0.8
    testable_via: [shadow_as_design_element, contrast_ratio]
# -----------------------------------------------------------------------------
# FORM DİLİ
forms:
  silhouettes:
    - low platform sofa on short tapered legs
    - rounded-rectangle table with softly eased edges
    - open shelf with a single dark vertical
    - spindle-back chair with a gentle curved crest
    - slatted screen / room divider
    - cylinder-based side table (single turned column)
    - bench with woven paper-cord seat
  geometry_language:
    - soft rectangle with 4-12 mm radius corners
    - gentle taper (3-6°) on legs
    - shallow continuous curve (single radius, R300-R1200) for crest rails
    - constant slat pitch 25-45 mm
    - flat plane panels with 2-3 mm shadow gap
    - circle as a rare, deliberate exception (turned stool top)
  line_quality:
    - soft continuous line
    - hand-eased arris
    - no hard 90° visual corner
    - no freehand wobble
  edge_treatment:
    - 'eased edge: 3-6 mm radius or a soft 45° break'
    - hand-planed chamfer on visible top arris
    - shadow gap 3 mm between panel and frame
  mass_vs_void: Balanced-to-light. Solid volumes stay low and small; verticals are thin and widely spaced. Void 30-50%.
  preferred_archetypes:
    - sofa
    - armchair
    - lounge_chair
    - chair
    - bench
    - coffee_table
    - side_table
    - dining_table
    - sideboard
    - shelf_unit
    - bed
    - headboard
    - nightstand
    - tv_unit
  forbidden_forms:
    - monolithic heavy plinth
    - pointed arch / ogive
    - sharp chamfer-only brutal edge
    - high-back throne silhouette
    - exposed industrial tube frame
    - curvilinear baroque scroll
    - asymmetric sculptural blob
# -----------------------------------------------------------------------------
# MALZEMELER (primary / secondary / accent / forbidden / combination_rules)
materials:
  primary:
    - material_id: ash_light_oiled
      material_tr: Açık yağlı dişbudak
      finish: oiled
      why: Pale, straight grain, excellent for steam bending and visible joinery.
      why_tr: Açık renk, düz damar; buharla bükme ve görünür birleşim için mükemmel.
      applies_to_parts: [frame, leg, rail, seat, back_support, shelf, panel]
      cost_tier: 2
      weight: 1.0
    - material_id: oak_white_soaped
      material_tr: Beyaz sabunlu meşe
      finish: soap_finished
      why: 'The Scandinavian signature: near-white, matte, silky touch.'
      why_tr: 'İskandinav imzası: beyaza yakın, mat, ipeksi dokunuş.'
      applies_to_parts: [top_surface, panel, shelf, door, drawer_front]
      cost_tier: 3
      weight: 0.85
    - material_id: hinoki_or_light_softwood
      material_tr: Hinoki / açık renk yumuşak ağaç
      finish: raw
      why: Japanese reference; warm scent, very pale, soft edges.
      why_tr: Japon referansı; sıcak koku, çok açık renk, yumuşak kenarlar.
      applies_to_parts: [panel, slats, door, top_surface]
      cost_tier: 3
      weight: 0.55
  secondary:
    - material_id: linen_natural
      material_tr: Doğal keten
      finish: raw
      why: Textural counterpoint to smooth wood; the essential softness.
      why_tr: Pürüzsüz ahşaba dokusal karşıtlık; temel yumuşaklık.
      applies_to_parts: [upholstery, cushion, panel]
      cost_tier: 2
      weight: 0.85
    - material_id: paper_cord
      material_tr: Kağıt ip (danish cord)
      finish: raw
      why: 'Woven seat: light, repairable, warm, historically exact for both traditions.'
      why_tr: 'Dokuma oturma: hafif, tamir edilebilir, sıcak; iki gelenek için de tarihsel olarak doğru.'
      applies_to_parts: [seat, back_support]
      cost_tier: 2
      weight: 0.8
    - material_id: wool_boucle_light
      material_tr: Açık renk yün buklet
      finish: raw
      why: Adds a soft light-catching texture on lounge seating only.
      why_tr: Yalnızca dinlenme oturmalarında ışık yakalayan yumuşak doku katar.
      applies_to_parts: [upholstery, cushion]
      cost_tier: 3
      weight: 0.5
    - material_id: ceramic_glazed
      material_tr: Sırlı seramik
      finish: matte_lacquer
      why: Small accessory/detail; matte, uneven glaze reads as handmade.
      why_tr: Küçük aksesuar/detay; mat, düzensiz sır el yapımı okunur.
      applies_to_parts: [ornament, hardware]
      cost_tier: 2
      weight: 0.3
  accent:
    - material_id: walnut_dark_oiled
      material_tr: Koyu yağlı ceviz
      finish: oiled
      why: 'The single dark anchor: one component (a leg pair, a handle, a shelf edge) — never more.'
      why_tr: 'Tek koyu çapa: bir bileşen (bir ayak çifti, bir kulp, bir raf kenarı) — asla daha fazlası.'
      applies_to_parts: [leg, hardware, edge_treatment, rail, drawer_front]
      cost_tier: 4
      weight: 0.9
    - material_id: blackened_steel_thin
      material_tr: İnce karartılmış çelik
      finish: blackened
      why: Optional 6-10 mm structural accent (a pin, a stretcher rod, a hinge).
      why_tr: Opsiyonel 6-10 mm yapısal vurgu (bir pim, bir gergi çubuğu, bir menteşe).
      applies_to_parts: [stretcher, hardware, joint]
      cost_tier: 2
      weight: 0.4
    - material_id: iron_black_matte
      material_tr: Mat siyah demir
      finish: matte_lacquer
      why: Handle and hinge family; matte, small, recessed.
      why_tr: Kulp ve menteşe ailesi; mat, küçük, içerlek.
      applies_to_parts: [hardware, joint]
      cost_tier: 2
      weight: 0.5
  forbidden_materials:
    - high-gloss lacquer
    - chrome / mirror metal
    - marble, granite, any polished stone
    - concrete
    - gilded brass
    - plastic in saturated colour
    - printed laminate with fake grain
    - velvet in jewel tones
    - shou sugi ban heavy char (too dark/too dramatic for japandi; belongs to gothic_minimalism/brutalism)
    - rattan in tropical styling
  combination_rules:
    - pair:
        - ash_light_oiled
        - linen_natural
      verdict: signature
      note: Smooth pale wood + rough natural textile = the core textural contrast.
    - pair:
        - oak_white_soaped
        - walnut_dark_oiled
      verdict: signature
      note: Light body, dark accent component. Max 10% dark coverage.
    - pair:
        - ash_light_oiled
        - paper_cord
      verdict: signature
      note: Woven seat on a light frame; repairable and warm.
    - pair:
        - hinoki_or_light_softwood
        - ceramic_glazed
      verdict: allowed
      note: Small ceramic detail on wood; keep the ceramic matte and neutral.
    - pair:
        - ash_light_oiled
        - blackened_steel_thin
      verdict: allowed
      note: Thin black pin/stretcher only; never a full black frame (that becomes Bauhaus/high-tech).
    - pair:
        - oak_white_soaped
        - marble_honed
      verdict: forbidden
      note: Stone coldness and weight contradict the soft, low, warm logic.
    - pair:
        - ash_light_oiled
        - chrome
      verdict: forbidden
      note: Mirror metal breaks the matte quiet.
  material_honesty_rules:
    - Solid wood must be solid on visible faces; veneer only on large flat panels and declared.
    - No printed grain, no whitewash that hides the grain structure.
    - Textile must be natural fibre (linen, cotton, wool, paper) or an honest declared blend.
    - Knots and grain variation are features; filler is not — if filler is used, it must be tinted and recessed.
# -----------------------------------------------------------------------------
# RENK
colors:
  palette:
    - { hex: '#D8C7AC', name: Oiled Ash, name_tr: Yağlı Dişbudak, role: dominant, max_coverage: 0.4 }
    - hex: '#EDE6DA'
      name: Soaped Oak / Natural Linen
      name_tr: Sabunlu Meşe / Doğal Keten
      role: dominant
      max_coverage: 0.3
    - { hex: '#C4B49C', name: Paper Cord, name_tr: Kağıt İp, role: secondary, max_coverage: 0.15 }
    - { hex: '#9A8B77', name: Warm Greige Shadow, name_tr: Sıcak Gölge Griji, role: secondary, max_coverage: 0.1 }
    - { hex: '#4A3A2C', name: Dark Walnut Anchor, name_tr: Koyu Ceviz Çapa, role: accent, max_coverage: 0.07 }
    - { hex: '#2A2724', name: Matte Black Detail, name_tr: Mat Siyah Detay, role: accent, max_coverage: 0.03 }
    - hex: '#7C8A6E'
      name: Muted Moss (optional)
      name_tr: Soluk Yosun (opsiyonel)
      role: accent
      max_coverage: 0.02
    - { hex: '#B0A293', name: Ceramic Grey, name_tr: Seramik Grisi, role: highlight, max_coverage: 0.05 }
  value_range: mid-to-high lightness; 55-80 L* for 80% of the object, dark accent 20-30 L*
  saturation_range: very low; C* < 15 for woods/textiles, accent C* < 25
  contrast_rule: Low overall contrast with ONE dark anchor. Contrast must be textural first, tonal second.
  forbidden_colors:
    - saturated red, orange, purple, teal, pink
    - neon / fluorescent
    - pure black as a dominant surface
    - pure clinical white
    - metallic gold / silver
    - gradient or ombre
    - more than one dark anchor colour
# -----------------------------------------------------------------------------
# DOKU
textures:
  dominant:
    - open-pore oiled wood grain, fine and straight
    - natural linen slub weave
    - twisted paper cord weave
    - soap-finished matte silky wood
  contrast_textures:
    - one rougher hand-planed facet
    - matte ceramic glaze with slight pooling
    - soft wool bouclé on a single lounge component
  scale_of_texture: fine
  reflectance_profile: 'all matte: 3-12 gloss units. No surface above 20 gloss units anywhere.'
  forbidden_textures:
    - gloss / mirror
    - hammered metal
    - heavy charred timber
    - stone porosity
    - shaggy long pile
    - printed pattern / graphic
    - quilted diamond tufting
    - distressed paint
# -----------------------------------------------------------------------------
# SÜSLEME KURALLARI
ornament_rules:
  max_level: subtle
  allowed:
    - visible joinery (through-wedge tenon, finger joint, dowel pattern)
    - constant-pitch slats / spindles
    - a single dark accent component
    - hand-planed facet on one arris
    - woven pattern of the seat membrane (functional weave)
    - soft radius corner
  discouraged: [carved line motifs, inlay beyond a single 3 mm line, engraving]
  forbidden:
    - applied mouldings / trim
    - gilding, brass inlay, marquetry figurative patterns
    - tufting, buttons, nail-head trim, piping
    - figurative imagery, animals, florals, logos
    - gothic tracery, arches, religious motifs
    - geometric pattern painting on surfaces
    - fringe, tassels, macramé
  placement_rules:
    - Ornament may only be a by-product of construction (the joint, the weave, the slat rhythm).
    - Dark accent must be on ONE component and must not exceed 10% of visible area.
    - Never decorate a user-contact surface.
  motif_vocabulary:
    - wedge tenon
    - finger joint
    - spindle rhythm
    - slat screen
    - soft radius
    - single dark line
  ornament_must_be:
    - structural
    - functional_weave
    - single-accent
    - non-figurative
    - repairable
# -----------------------------------------------------------------------------
# ORANLAR
proportions:
  dominant_direction: horizontal
  ratio_presets:
    - { name: low lounge height, value: 0.62, applies_to: sofa/armchair total height / width }
    - { name: table height ratio, value: 0.4, applies_to: dining table height / width (700mm on 1750mm) }
    - { name: leg taper, value: 0.65, applies_to: leg top section / leg bottom section width }
    - { name: slat pitch to width, value: 1.8, applies_to: slat centre-to-centre / slat width }
    - { name: seat to total height, value: 0.48, applies_to: 'low lounge: seat height / total height' }
  module_grid_mm: 30
  leg_to_body_ratio: legs 10-22% of total height for casegoods (low look); chairs 50-58%
  seat_height_bias: 'low: 380-420 mm (lounge), 340-380 mm (platform sofa), 430-450 mm (dining chair)'
  void_ratio_target: 0.42
  scale_bias: compact
  symmetry_preference: loose_bilateral
# -----------------------------------------------------------------------------
# IŞIK VE GÖLGE (render direktifleri dahil)
lighting_and_shadow:
  light_direction:
    - large diffused window light from one side
    - soft overhead bounce
    - no direct spot
  light_quality: soft, diffused, 3000-4200K, large source relative to the object; shadows soft-edged
  shadow_role: Gentle. A short soft contact shadow grounds the object; there is no dramatic shadow play.
  highlight_strategy: Broad soft sheen across the wood grain; a single subtle specular line along the eased arris.
  render_notes: 'Warm-neutral interior backdrop (#E9E4DC wall, #D9CDBB floor), morning daylight, soft shadow. Include a minimal styling context (one ceramic vessel, one textile) to communicate the calm domestic ritual. Camera 35 mm at 100 cm, straight-on three-quarter. Exposure +0.3 EV. Absolutely no chiaroscuro. '
# -----------------------------------------------------------------------------
# DUYGUSAL ANAHTAR KELİMELER
emotional_keywords:
  - calm
  - warm
  - quiet
  - domestic
  - tactile
  - unhurried
  - clean
  - humble
  - repairable
  - daylit
emotional_keywords_tr:
  - sakin
  - sıcak
  - sessiz
  - evcil
  - dokunsal
  - acelesiz
  - temiz
  - mütevazı
  - tamir edilebilir
  - gün ışıklı
# -----------------------------------------------------------------------------
# YASAK SİNYALLER (hard = tasarım reddedilir, soft = skor düşer)
forbidden_signals:
  - id: fb_gloss
    signal: Any surface above 20 gloss units; chrome, mirror, piano finish.
    signal_tr: 20 gloss birimi üstü yüzey; krom, ayna, piyano cila.
    severity: hard
    detected_by: [gloss_absence, reflectance_profile]
  - id: fb_dark_drama
    signal: Dominant dark palette with hard chiaroscuro; the piece reads as gothic or brutalist.
    signal_tr: Sert gölge dramıyla baskın koyu palet; parça gotik veya brutalist okunuyor.
    severity: hard
    detected_by: [dark_materiality, low_key_palette, shadow_as_design_element]
  - id: fb_stone_cold
    signal: Stone, marble, concrete or other cold heavy mass.
    signal_tr: Taş, mermer, beton veya soğuk ağır kütle.
    severity: hard
    detected_by: [warmth_index, massiveness]
  - id: fb_ornament_bloat
    signal: Carving, applied trim, tufting, figurative pattern.
    signal_tr: Oyma, uygulanmış çıta, kapitone, figüratif desen.
    severity: hard
    detected_by: [ornament_density, figurative_ornament]
  - id: fb_industrial_exposure
    signal: Exposed tubular steel frame, visible industrial fasteners as the dominant aesthetic.
    signal_tr: Açık boru çelik çerçeve, baskın estetik olarak görünür endüstriyel bağlantılar.
    severity: soft
    detected_by: [industrial_index, handcraft_index]
  - id: fb_tall_monument
    signal: High vertical aspiration, height/width > 1.8 on seating, throne-like back.
    signal_tr: Yüksek dikey yükseliş, oturmada yükseklik/genişlik > 1.8, taht benzeri sırt.
    severity: hard
    detected_by: [verticality, height_width_bias]
  - id: fb_saturated_pop
    signal: More than one saturated hue, or a saturated hue above 5% coverage.
    signal_tr: Birden fazla doygun renk veya %5 üstü kapsama sahip doygun renk.
    severity: hard
    detected_by: [chroma_restraint]
  - id: fb_sharp_brutal_edge
    signal: Hard knife edges and 45° chamfers everywhere with no easing — reads brutalist, not japandi.
    signal_tr: Her yerde sert bıçak kenar ve 45° pah, yumuşatma yok — japandi değil brutalist okunur.
    severity: soft
    detected_by: [geometric_strictness, edge_softness]
  - id: fb_copyright_copy
    signal: Silhouette identical to a named Scandinavian or Japanese designer piece.
    signal_tr: Siluetin isimli bir İskandinav veya Japon tasarımcı parçasıyla aynı olması.
    severity: hard
    detected_by: [originality_check]
# -----------------------------------------------------------------------------
