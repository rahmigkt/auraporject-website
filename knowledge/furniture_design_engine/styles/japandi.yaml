# NEGATİF PROMPT TOKEN'LARI
negative_prompt_tokens:
  core:
    - ornate carving
    - applied moulding
    - decorative trim
    - gilding
    - tufting
    - piping
    - nail-head trim
    - figurative pattern
  style_specific:
    - gothic arch
    - pointed arch
    - dark chiaroscuro
    - blackened oak dominance
    - concrete
    - board-formed concrete
    - marble top
    - granite
    - stone plinth
    - chrome
    - mirror finish
    - high gloss lacquer
    - brass gold
    - art deco sunburst
    - baroque
    - rococo
    - memphis pattern
    - neon colours
    - saturated red
    - pastel pink
    - velvet jewel tones
    - shabby chic
    - distressed paint
    - farmhouse rustic heavy grain
    - tropical rattan resort
    - industrial exposed pipe frame
    - heavy charred timber
  anatomy_defects:
    - mismatched legs
    - legs of different lengths
    - floating furniture with no ground contact
    - backrest not connected to seat frame
    - seat membrane sagging
    - parts merging
    - duplicated components
    - warped frame
    - impossible joint
  physics_defects:
    - slender leg under a heavy stone top
    - unsupported shelf span over 800mm in softwood
    - paper cord seat without a supporting frame perimeter
    - cross-grain load path
    - top-heavy without base width
    - no visible load path to the floor
  copyright_guards:
    - exact replica of a named designer chair
    - branded furniture
    - visible logo
    - trademarked product
# -----------------------------------------------------------------------------
# ÜRETİM NOTLARI
manufacturing_notes:
  preferred_processes:
    - mortise_tenon
    - doweling
    - steam_bending
    - lathe_turning
    - cnc_routing
    - hand_carving
    - webbing
    - oil_finishing
    - finger_joint
  avoid_processes:
    - injection_molding
    - chrome_plating
    - casting_sand
    - concrete_casting
    - gloss polyurethane spraying
  joint_language:
    - through-wedge tenon with a 2 mm proud wedge (the signature visible joint)
    - round dowel grid on panel-to-frame connections
    - finger joint on drawer boxes, glued and sanded flush
    - steam-bent crest rail into a round mortise
    - paper cord laced over a 20 mm frame rebate with a 3 mm rounding
    - concealed hinge with soft-close, recessed 12 mm
  joinery_visibility: celebrated
  typical_thickness_mm:
    frame_member: 28
    leg: 34
    seat_frame: 22
    panel: 18
    shelf: 20
    top_surface: 25
    slat: 12
    spindle: 16
  tolerance_notes: 'Visible joints demand tight tolerance: tenon fit +/-0.1 mm, wedge slot 2.0 mm +/-0.1. Moisture movement is the main risk — build at 8-10% MC for EU indoor use, leave 1.5 mm per 400 mm of cross-grain width in frame-and-panel construction, and use slotted holes on all top fixings. Steam bending: ash, 20 min per 25 mm of thickness at 100 °C, over-bend 8-12% for spring-back. '
  finishing_notes: 'Hardwax oil or soap finish only. Soap finish recipe: pure soap flakes dissolved in warm water (1:20), applied 3 coats, sanded 320 between. Never polyurethane gloss. Textiles: untreated or OEKO-TEX certified, removable covers with a hidden zip. '
  cost_drivers:
    - hand-laced paper cord seats
    - visible joinery tolerance
    - steam-bent components
    - solid pale hardwood selection (colour consistency)
  sustainability_notes: FSC ash/oak, water-based finishes, mechanical joints for repair and disassembly, natural fibre textiles, no foam where a woven membrane works.
  flat_pack_feasible: true
  difficulty: 3
