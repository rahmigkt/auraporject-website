# PARÇA DİREKTİFLERİ — her parça bu stilde nasıl davranır?
# part_role değerleri schemas/furniture_parts.schema.json -> $defs.partRoleId
part_directives:
  - part_role: leg
    directive: Round or softly square, tapered 3-6°, 28-40 mm at top to 20-28 mm at floor; height 120-200 mm for casegoods, 400-450 mm for dining chairs.
    directive_tr: Yuvarlak veya yumuşak kare, 3-6° konik, üstte 28-40 mm zemine doğru 20-28 mm; dolaplarda 120-200 mm, yemek sandalyesinde 400-450 mm yükseklik.
    typical_material: ash_light_oiled
    typical_dimension_hint: top 34mm -> floor 24mm; taper 4°
    ornament_level: none
    priority: must
  - part_role: foot
    directive: Same timber continues to the floor with a 2 mm eased end and a felt glide. No metal cap, no plinth.
    directive_tr: Aynı ahşap 2 mm yumuşatılmış uç ve keçe kaydırıcıyla zemine iner. Metal pabuç yok, kaide yok.
    typical_material: ash_light_oiled
    typical_dimension_hint: felt glide 12mm dia, 3mm thick
    ornament_level: none
    priority: should
  - part_role: seat
    directive: Woven paper cord on a 20 mm rebate, or 18-22 mm solid timber with a 4 mm eased edge, or a 60-90 mm linen cushion over a webbing base.
    directive_tr: 20 mm yuvada dokuma kağıt ip, ya 4 mm yumuşatılmış kenarlı 18-22 mm masif ahşap, ya da dokuma taban üstünde 60-90 mm keten minder.
    typical_material: paper_cord
    typical_dimension_hint: seat height 380-450mm; depth 400-460mm
    ornament_level: subtle
    priority: must
  - part_role: back_support
    directive: Low, wide, gently curved crest rail (single radius R400-R900) or 4-7 vertical spindles at 35-50 mm pitch. Recline 100-108°.
    directive_tr: Alçak, geniş, nazikçe kavisli tepe çıtası (tek yarıçap R400-R900) veya 35-50 mm adımda 4-7 dikey mil. Eğim 100-108°.
    typical_material: ash_light_oiled
    typical_dimension_hint: back height 280-420mm above seat
    ornament_level: subtle
    priority: must
  - part_role: arm_support
    directive: Soft continuous curve flowing from the crest rail, 200-240 mm above seat, section 22x30 mm with fully eased edges.
    directive_tr: Tepe çıtasından akan yumuşak sürekli eğri, oturmada 200-240 mm yukarıda, tamamen yumuşatılmış kenarlı 22x30 mm kesit.
    typical_material: ash_light_oiled
    typical_dimension_hint: arm height 600-660mm from floor
    ornament_level: none
    priority: should
  - part_role: frame
    directive: Solid timber frame with visible through-wedge tenons at every major junction; member section constant 22-32 mm.
    directive_tr: Her ana kavşakta görünür kamalı geçer zıvanalı masif ahşap çerçeve; eleman kesiti sabit 22-32 mm.
    typical_material: ash_light_oiled
    typical_dimension_hint: 28x28mm typical; tenon = 1/3 thickness
    ornament_level: subtle
    priority: must
  - part_role: top_surface
    directive: 22-30 mm solid timber or 20 mm ply with a solid lipped edge; all arrises eased 4-6 mm; overhang 30-50 mm.
    directive_tr: 22-30 mm masif ahşap veya masif kenarlı 20 mm kontrplak; tüm kenarlar 4-6 mm yumuşatılmış; taşma 30-50 mm.
    typical_material: oak_white_soaped
    typical_dimension_hint: table height 680-720mm; thickness 25mm
    ornament_level: none
    priority: must
  - part_role: shelf
    directive: 18-22 mm, span <= 700 mm in ash, adjustable on a 30 mm pitch; back edge 3 mm shadow gap.
    directive_tr: 18-22 mm, dişbudakta açıklık <= 700 mm, 30 mm adımda ayarlanabilir; arka kenar 3 mm gölge aralığı.
    typical_material: ash_light_oiled
    typical_dimension_hint: 20mm thick, 30mm pitch adjustment
    ornament_level: none
    priority: must
  - part_role: panel
    directive: Flat, 15-18 mm, frame-and-panel with 3 mm movement gap; never a raised field, never a moulded edge.
    directive_tr: Düz, 15-18 mm, 3 mm hareket boşluklu çerçeve-panel; asla yükseltilmiş alan, asla profilli kenar.
    typical_material: hinoki_or_light_softwood
    typical_dimension_hint: 15-18mm; gap 3mm
    ornament_level: none
    priority: should
  - part_role: door
    directive: Full-height or slatted; recessed 12 mm handle groove or a single matte black pull. Soft-close concealed hinge.
    directive_tr: Tam boy veya çıtalı; 12 mm içerlek kulp oyuğu veya tek mat siyah çekme. Yumuşak kapanan gizli menteşe.
    typical_material: ash_light_oiled
    typical_dimension_hint: gap 3mm; handle recess 12x80mm
    ornament_level: subtle
    priority: should
  - part_role: hardware
    directive: Matte black or dark walnut, small and recessed. One family per piece. No brass, no chrome.
    directive_tr: Mat siyah veya koyu ceviz, küçük ve içerlek. Parça başına bir aile. Pirinç yok, krom yok.
    typical_material: iron_black_matte
    typical_dimension_hint: pull 96-128mm; diameter 10-12mm
    ornament_level: subtle
    priority: must
  - part_role: joint
    directive: The decoration of this style. Through-wedge tenon, finger joint or dowel pattern must be visible, precise, and consistent.
    directive_tr: Bu stilin süslemesi. Kamalı geçer zıvana, parmak birleşim veya dübel deseni görünür, hassas ve tutarlı olmalı.
    typical_material: ash_light_oiled
    typical_dimension_hint: wedge 2mm; tenon fit +/-0.1mm
    ornament_level: subtle
    priority: must
  - part_role: upholstery
    directive: Natural linen or light wool, 60-110 mm, removable cover, hidden zip, single seam line. No tufting, no piping.
    directive_tr: Doğal keten veya açık yün, 60-110 mm, çıkarılabilir kılıf, gizli fermuar, tek dikiş çizgisi. Kapitone yok, biye yok.
    typical_material: linen_natural
    typical_dimension_hint: cushion 80-110mm; removable cover
    ornament_level: none
    priority: should
  - part_role: edge_treatment
    directive: Eased 4-6 mm radius or a soft hand-planed break. Never a knife edge, never a hard 90° visual corner.
    directive_tr: 4-6 mm yumuşatılmış yarıçap veya yumuşak el rendesi kırığı. Asla bıçak kenar, asla sert 90° görsel köşe.
    typical_material: null
    typical_dimension_hint: R4-6mm
    ornament_level: subtle
    priority: must
  - part_role: ornament
    directive: One dark walnut accent component OR one visible joint family. Never both plus anything else.
    directive_tr: Bir koyu ceviz vurgu bileşeni VEYA bir görünür birleşim ailesi. Asla ikisi artı başka bir şey.
    typical_material: walnut_dark_oiled
    typical_dimension_hint: dark coverage <= 10% of visible area
    ornament_level: subtle
    priority: may
