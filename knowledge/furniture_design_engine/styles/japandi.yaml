# CANLI ÇİZİM GERİ BİLDİRİM CÜMLELERİ
sketch_feedback:
  on_good_signal:
    - Leg taper is in the 3-6° band — reads calm and grounded.
    - Visible wedge tenon detected. That joint is the decoration; keep it precise.
    - 'Edges are eased. Good: nothing here is sharp.'
    - One dark accent component only. Contrast is correctly restrained.
  on_weak_signal:
    - Void ratio is low — the piece feels heavy for japandi. Remove a panel or thin the slats.
    - The back is getting tall. Japandi keeps the visual centre of gravity below 500 mm.
    - 'Texture pairing is missing: add one rough textile against the smooth wood.'
  on_violation:
    - Glossy surface detected. Japandi is matte only (3-12 gloss units).
    - Stone/concrete mass detected. This style is warm timber and textile only.
    - Two saturated colours detected. Keep one dark anchor and neutrals.
    - Hard 45° chamfer everywhere — that reads brutalist, not japandi. Ease the edges.
    - Vertical aspiration too strong (h/w > 1.8). Lower the silhouette.
    - Applied ornament detected. Ornament may only be a by-product of construction.
    - Seat-to-floor load path is broken. Add a stretcher or thicken the leg.
  on_violation_tr:
    - Parlak yüzey tespit edildi. Japandi yalnızca mattır (3-12 gloss birimi).
    - Taş/beton kütle tespit edildi. Bu stil yalnızca sıcak ahşap ve tekstildir.
    - İki doygun renk tespit edildi. Bir koyu çapa ve nötrler korunmalı.
    - Her yerde sert 45° pah — bu japandi değil brutalist okunur. Kenarları yumuşat.
    - Dikey yükseliş çok güçlü (h/g > 1.8). Silueti alçalt.
    - Uygulanmış süsleme tespit edildi. Süsleme yalnızca inşaatin yan ürünü olabilir.
    - Oturmadan zemine yük yolu kesik. Bir kiriş ekle veya ayağı kalınlaştır.
  suggested_next_strokes:
    - Draw the ground line, then four tapered legs at 3-6°.
    - Add the seat plane with a 4-6 mm eased edge.
    - Mark one wedge tenon at the leg-to-rail junction.
    - 'Lower the crest rail: keep total height under 800 mm for a lounge piece.'
    - Insert 5 spindles at a constant 40 mm pitch for the back.
