# ÜRETİM NOTLARI
manufacturing_notes:
  preferred_processes:
    - concrete_casting
    - welding_mig
    - welding_tig
    - press_forming
    - laser_cutting
    - waterjet
    - surface_grinding
    - shou_sugi_ban
    - cnc_milling
  avoid_processes:
    - chrome_plating
    - veneer_pressing
    - injection_molding
    - hand_carving (decorative)
    - gloss lacquer spraying
  joint_language:
    - cast-in threaded inserts (M10/M12) for demountable concrete-to-steel connections
    - visible rubber or neoprene isolation pad between concrete and steel/stone
    - full-penetration welded steel frame, ground flush with the bead visible
    - epoxy-bonded stone-to-concrete with a declared 3 mm movement joint
    - through-bolt with a recessed washer pocket, plug-filled or left honest
    - mortise-and-housed timber-to-concrete with a stainless pin
  joinery_visibility: celebrated
  typical_thickness_mm:
    concrete_slab: 60
    concrete_min: 40
    steel_plate: 6
    steel_frame_member: 12
    timber_slab: 50
    charred_cladding: 22
    stone_top: 30
    isolation_pad: 5
    reveal_depth: 30
  tolerance_notes: 'Concrete casting tolerance is the hard part: dimensional +/-2 mm, arris quality depends on mould seal (use melamine-faced ply or machined MDF, sealed with release agent, screwed not nailed). Demould at 24 h minimum, cure 28 days before full load. Shrinkage cracking: control with a maximum 1:2000 unreinforced span and fibre reinforcement. Steel: cut tolerance +/-0.5 mm, weld distortion control by jigging and back-step welding. Concrete-to-steel interface: always an isolation pad, never direct bearing (staining + point loading). '
  finishing_notes: 'Concrete: penetrating silane/siloxane sealer, matte, no film. Do NOT use a topical gloss coat — it fakes the material. Steel: hot black oxide or a matte two-pack at 10-15 gloss. Timber: hardwax oil over rough-sawn faces; charred faces brushed and sealed with a matte penetrating oil. '
  cost_drivers:
    - mould making (each new geometry needs a new sealed mould)
    - 'weight: freight and handling for 40-120 kg pieces'
    - 28-day cure cycle (inventory cash flow)
    - stone fabrication
    - manual grinding and finishing of large welds
  sustainability_notes: 'Concrete has high embodied carbon: use GGBS/fly-ash replacement (40-60%) where structural calculations allow, or consider a lightweight aggregate core with a dense facing. Design for demountability (threaded inserts) so steel and stone can be reused. Never specify CITES timber. '
  flat_pack_feasible: false
  difficulty: 4
