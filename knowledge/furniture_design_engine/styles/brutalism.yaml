# PARÇA DİREKTİFLERİ — her parça bu stilde nasıl davranır?
# part_role değerleri schemas/furniture_parts.schema.json -> $defs.partRoleId
part_directives:
  - part_role: leg
    directive: 'Not a leg — a plinth, a block, or a welded steel base frame. If a leg must exist: 60-120 mm square section, concrete or 6-12 mm folded steel. Never slender.'
    directive_tr: 'Bir bacak değil — bir kaide, bir blok veya kaynaklı çelik kaide çerçevesi. Bacak zorunluysa: 60-120 mm kare kesit, beton veya 6-12 mm bükümlü çelik. Asla narin.'
    typical_material: concrete_board_formed
    typical_dimension_hint: section 60-120mm; height 40-160mm (plinth) or 380-440mm (bench block)
    ornament_level: none
    priority: must
  - part_role: foot
    directive: Lands directly on the floor through a 3-5 mm black rubber isolation pad, or is recessed 30-60 mm to create a shadow gap. Never a decorative cap.
    directive_tr: 3-5 mm siyah kauçuk izolasyon pedi üzerinden doğrudan zemine basar, ya da gölge aralığı için 30-60 mm içerlektir. Asla dekoratif pabuç.
    typical_material: rubber_isolation_pad
    typical_dimension_hint: pad 3-5mm; recess 30-60mm
    ornament_level: none
    priority: must
  - part_role: base_plinth
    directive: 'The signature element: 40-120 mm high, recessed 30-60 mm from the body face, cast in one pour with the body or bolted with a visible isolation pad.'
    directive_tr: 'İmza eleman: 40-120 mm yüksek, gövdeden 30-60 mm içerlek, gövdeyle tek döküm ya da görünür izolasyon pediyle cıvatalı.'
    typical_material: concrete_board_formed
    typical_dimension_hint: height 40-120mm; recess 30-60mm
    ornament_level: none
    priority: must
  - part_role: top_surface
    directive: 60-120 mm cast concrete (span/12 minimum), 30-50 mm honed stone, or 50-80 mm rough-sawn timber. One mould chamfer 8-25 mm at 20-45°. No radius beyond the mould arris.
    directive_tr: 60-120 mm dökme beton (minimum açıklık/12), 30-50 mm honlu taş veya 50-80 mm kaba biçilmiş ahşap. 20-45° açıda tek kalıp pahi 8-25 mm. Kalıp kenarı dışında yarıçap yok.
    typical_material: concrete_board_formed
    typical_dimension_hint: concrete 60-120mm; stone 30-50mm; timber 50-80mm
    ornament_level: none
    priority: must
  - part_role: panel
    directive: Thick, board-formed, with the imprint pitch running in one direction only. Tie holes on a 300-450 mm grid, all kept or all patched.
    directive_tr: Kalın, kalıp izli, iz adımı yalnızca bir yönde ilerler. Bağlantı delikleri 300-450 mm ızgarada, ya hepsi korunur ya hepsi kapanır.
    typical_material: concrete_board_formed
    typical_dimension_hint: 40-80mm thick; board pitch 90-150mm
    ornament_level: none
    priority: must
  - part_role: frame
    directive: Folded or welded steel, 6-12 mm plate, full-penetration welds ground flush with the bead still visible. Black oxide or matte two-pack.
    directive_tr: Bükümlü veya kaynaklı çelik, 6-12 mm sac, tam nüfuziyetli kaynaklar taşlanıp düz, dikiş yine görünür. Siyah oksit veya mat iki bileşenli boya.
    typical_material: steel_folded_raw
    typical_dimension_hint: plate 6-12mm; member 40x40 to 80x80mm
    ornament_level: none
    priority: must
  - part_role: seat
    directive: Solid concrete/stone/timber with an optional 4-6 mm thick saddle leather pad, or a 60-90 mm firm pad in dark full-grain leather. No fabric, no soft cushion look.
    directive_tr: Opsiyonel 4-6 mm kalın eyer derisi pedli masif beton/taş/ahşap, ya da koyu tam deride 60-90 mm sert ped. Kumaş yok, yumuşak minder görünümü yok.
    typical_material: leather_thick_natural
    typical_dimension_hint: seat height 420-460mm; pad 4-90mm depending on type
    ornament_level: none
    priority: must
  - part_role: shelf
    directive: Cast concrete shelf 40-60 mm thick, span <= 600 mm, or 8-12 mm steel plate span <= 700 mm. Support by deep housing into the side panels, not by small pins.
    directive_tr: 40-60 mm kalın dökme beton raf, açıklık <= 600 mm, ya da 8-12 mm çelik sac açıklık <= 700 mm. Küçük pimlerle değil yan panellere derin yuva ile destek.
    typical_material: concrete_board_formed
    typical_dimension_hint: 40-60mm thick; span <= 600mm; housing depth >= 25mm
    ornament_level: none
    priority: should
  - part_role: hardware
    directive: Recessed finger pull cut into the mass (20-30 mm deep reveal), a raw brass bar that patinas, or nothing at all (push-to-open). Never chrome, never decorative.
    directive_tr: Kütlenin içine oyulmuş içerlek parmak çekme (20-30 mm derin içerlek), patina yapan ham pirinç çubuk ya da hiç yok (bas-aç). Asla krom, asla dekoratif.
    typical_material: raw_brass_unlacquered
    typical_dimension_hint: recess 20-30mm deep, 80-160mm long
    ornament_level: none
    priority: should
  - part_role: joint
    directive: 'Declared and visible: cast-in threaded insert + through bolt with a recessed washer pocket, or a full-penetration weld. Never hidden behind trim.'
    directive_tr: 'Beyan edilir ve görünür: döküm içi dişli insert + içerlek pul yuvalı geçer cıvata, ya da tam nüfuziyetli kaynak. Asla çıta arkasına gizlenmez.'
    typical_material: steel_blackened
    typical_dimension_hint: M10/M12 insert; washer pocket 24mm dia x 8mm deep
    ornament_level: none
    priority: must
  - part_role: ornament
    directive: Does not exist as a separate part. Any 'ornament' must be re-expressed as a process imprint, a reveal or a chamfer.
    directive_tr: Ayrı bir parça olarak yoktur. Her 'süsleme' bir süreç izi, içerlek veya pah olarak yeniden ifade edilmelidir.
    typical_material: null
    typical_dimension_hint: n/a
    ornament_level: none
    priority: must
  - part_role: edge_treatment
    directive: Mould arris as-cast (0-8 mm) or one chamfer family at 20-45°, 8-25 mm wide. Never eased, never rounded, never banded.
    directive_tr: Dökümden çıkan kalıp kenarı (0-8 mm) veya 20-45° açıda 8-25 mm genişliğinde tek bir pah ailesi. Asla yumuşatılmış, asla yuvarlatılmış, asla bantlı.
    typical_material: null
    typical_dimension_hint: chamfer 8-25mm @20-45°
    ornament_level: none
    priority: must
  - part_role: void
    directive: One rectangular opening or one core-drilled circle, 60-200 mm, positioned off-axis. Depth of the reveal must be constant and parallel.
    directive_tr: Bir dikdörtgen açıklık veya bir karotla delinmiş daire, 60-200 mm, eksen dışı yerleşim. İçerlek derinliği sabit ve paralel olmalı.
    typical_material: null
    typical_dimension_hint: opening 60-200mm; reveal depth constant +/-2mm
    ornament_level: none
    priority: should
  - part_role: stretcher
    directive: A welded steel plate gusset or a concrete rib, never a slim rod. Its purpose is visibly structural.
    directive_tr: Kaynaklı çelik sac köşebent veya beton kaburga, asla ince çubuk. Amacı görünür biçimde yapısal.
    typical_material: steel_folded_raw
    typical_dimension_hint: gusset 6-10mm plate; rib 40-60mm
    ornament_level: none
    priority: may
# -----------------------------------------------------------------------------
# CANLI ÇİZİM GERİ BİLDİRİM CÜMLELERİ
sketch_feedback:
  on_good_signal:
    - Massing reads heavy and low. That is the correct brutalist gravity.
    - Deep reveal detected at a constant depth — the shadow gap is doing the work.
    - Load path is traceable from the top surface to the floor through visible members.
    - No applied ornament. The only pattern is the process imprint.
  on_weak_signal:
    - Sections are getting thin. Brutalism needs 40-120 mm mass to read correctly.
    - The silhouette is too symmetric and refined. Offset one block by 20-60 mm.
    - Contrast is low. Deepen one reveal to 40-80 mm to create a true shadow void.
  on_violation:
    - Slender legs detected. Replace with a plinth, a block, or a 60-120 mm section.
    - Gloss/polished surface detected. This style is matte only (2-12 gloss units).
    - Applied ornament detected (inlay, moulding, pattern). Remove it; the process imprint is the only decoration.
    - Pale warm wood or natural textile detected. Swap to rough-sawn, charred timber, concrete or blackened steel.
    - Concrete slab thickness is below span/12 — it will crack or fail.
    - Heavy top with no visible load path to the floor. Add a core, a plinth or a welded frame.
    - Wandering reveal depth. Reveals must be constant and parallel or they read as formwork failure.
    - Faux-raw surface detected (printed texture / fake weld). Declare the real construction or change the material.
  on_violation_tr:
    - Narin bacaklar tespit edildi. Kaide, blok veya 60-120 mm kesitle değiştir.
    - Parlak/cilalı yüzey tespit edildi. Bu stil yalnızca mattır (2-12 gloss birimi).
    - Uygulanmış süsleme tespit edildi (kakma, çıta, desen). Kaldır; tek süsleme süreç izidir.
    - Açık sıcak ahşap veya doğal tekstil tespit edildi. Kaba biçilmiş, yakılmış ahşap, beton veya karartılmış çeliğe geç.
    - Beton tabla kalınlığı açıklık/12'nin altında — çatlar veya göçer.
    - Zemine görünür yük yolu olmayan ağır tabla. Bir çekirdek, kaide veya kaynaklı çerçeve ekle.
    - Kayan içerlek derinliği. İçerlekler sabit ve paralel olmalı, yoksa kalıp hatası gibi okunur.
    - Sahte-ham yüzey tespit edildi (baskılı doku / sahte kaynak). Gerçek inşaati beyan et veya malzemeyi değiştir.
  suggested_next_strokes:
    - Draw one big monolithic volume first; resist adding parts.
    - Recess the base 30-60 mm to create the plinth shadow gap.
    - Cut a single deep reveal (30-80 mm) as the only void.
    - Add one 45° mould chamfer along the top arris.
    - Offset one stacked block by a constant 20-60 mm.
