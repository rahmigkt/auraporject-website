    - pale oiled ash
    - soap finished oak
    - natural linen
    - cane webbing
    - paper cord
    - bouclé
    - velvet
    - rattan
    - bamboo
    - tubular steel frame
    - cantilever chair
    - plastic
    - pastel colours
    - neon
    - saturated colour
    - white minimalism
    - hygge cosy
    - shabby chic
    - farmhouse
    - printed concrete texture
    - faux finish
    - laminate
  anatomy_defects:
    - mismatched legs
    - thin slender legs under heavy mass
    - floating furniture with no ground contact
    - wandering reveal depth
    - random tie-hole scatter
    - parts merging
    - warped monolith
    - unequal block offsets
  physics_defects:
    - concrete slab spanning beyond span/12 thickness
    - unsupported concrete cantilever over 300mm
    - heavy stone top on slender supports
    - no visible load path to the floor
    - concrete in tension without reinforcement depth
    - top-heavy monolith with a narrow footprint
    - sharp concrete arris that would spall
  copyright_guards:
    - exact replica of a named designer piece
    - copy of a specific building façade
    - branded furniture
    - visible logo
