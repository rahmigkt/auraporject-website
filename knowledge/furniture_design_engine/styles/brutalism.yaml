# STİL UYUMLULUĞU VE HİBRİT TARİFLERİ
compatibility:
  blends_well_with: [gothic_minimalism, high_tech, industrial, wabi_sabi]
  conflicts_with:
    - art_deco
    - japandi
    - bauhaus
    - memphis
    - rococo_revival
    - scandinavian_modern
    - tropical_resort
  hybrid_recipes:
    - result_style_id: gothic_brutalist
      mix:
        - { style_id: gothic_minimalism, ratio: 0.5 }
        - { style_id: brutalism, ratio: 0.5 }
      note: Board-formed concrete mass + a single ogival void + chamfer discipline. Raise verticality target to 0.7, keep ornament_density <= 0.08.
    - result_style_id: brutalist_wabisabi
      mix:
        - { style_id: brutalism, ratio: 0.65 }
        - { style_id: wabi_sabi, ratio: 0.35 }
      note: Allow visible weathering, staining and repair patches; reduce massiveness target to 0.7; keep gloss_absence at 0.95.
# -----------------------------------------------------------------------------
# YASAL / ETİK UYUM
compliance:
  cultural_sensitivity_notes: No political iconography. Brutalism is often associated with specific state architecture; keep the output about material ethics, not ideology.
  religious_symbol_policy: forbidden_as_content
  do_not_replicate:
    - a specific building's façade geometry transferred 1:1 onto furniture
    - named brutalist designer pieces
    - any memorial or monument form
